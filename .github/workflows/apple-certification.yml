name: Apple certification external-interface stop

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current-main source SHA for local protocol qualification
        required: true
        type: string
      candidate_run_id:
        description: Exact candidate workflow run ID; syntax checked only while external execution is stopped
        required: true
        type: string
      candidate_run_attempt:
        description: Exact candidate workflow run attempt; syntax checked only while external execution is stopped
        required: true
        type: string
      candidate_artifact_id:
        description: Exact candidate artifact ID; syntax checked only while external execution is stopped
        required: true
        type: string
      candidate_artifact_digest:
        description: Canonical candidate artifact digest; syntax checked only while external execution is stopped
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: effect-build-apple-certification-v0.6.0
  cancel-in-progress: false

jobs:
  local-protocol-qualification:
    name: Qualify repository-owned Apple protocols without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Admit current-main attempt one and immutable input syntax
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = v24.14.1
          env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" \
            CONTRACT_PATH=tooling/effect-build-contract.json \
            REPOSITORY="$REPOSITORY" SOURCE_SHA="$EXPECTED_SHA" \
            ACTIONS_READ_TOKEN="$ACTIONS_READ_TOKEN" \
            node scripts/release/assert-current-main.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: node scripts/release/install-frozen-release-dependencies.mjs
      - name: Run only synthetic and credential-free Apple qualification
        shell: bash
        run: |
          set -euo pipefail
          bun run check:contract
          bun run build
          bun run --cwd packages/effect-build-apple test
          bunx vitest run \
            test/architecture/apple-certification-protocol.test.ts \
            test/architecture/apple-certification-workflow.test.ts

  admission:
    name: Stop hosted admission before every protected or certifying action
    needs: local-protocol-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Enforce the external journal, Apple, executor, and runner STOP
        run: node scripts/apple-certification/workflow.mjs --assert-hosted-ready

  native:
    name: "Inert native topology: ${{ matrix.coordinate }}"
    needs: admission
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - N-native-mechanics|macos-aarch64
          - N-native-mechanics|macos-x64
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  paired-app:
    name: "Inert paired-app topology: ${{ matrix.coordinate }}"
    needs: native
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - paired-app:bun
          - paired-app:deno
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  sign-app:
    name: "Inert sign-app topology: ${{ matrix.coordinate }}"
    needs: paired-app
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - P-signed-bun-app|macos-aarch64
          - P-signed-bun-app|macos-x64
          - P-signed-deno-app|macos-aarch64
          - P-signed-deno-app|macos-x64
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  distribution-pairs:
    name: "Inert distribution-pairs topology: ${{ matrix.coordinate }}"
    needs: sign-app
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - paired-product:dmg
          - paired-product:pkg
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  submit-product:
    name: "Inert submit-product topology: ${{ matrix.coordinate }}"
    needs:
      - sign-app
      - distribution-pairs
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - P-notarized-stapled-app-private-zip|macos-aarch64
          - P-notarized-stapled-app-private-zip|macos-x64
          - P-notarized-stapled-dmg|macos-aarch64
          - P-notarized-stapled-dmg|macos-x64
          - P-notarized-stapled-pkg|macos-aarch64
          - P-notarized-stapled-pkg|macos-x64
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  continue-notary:
    name: "Inert continue-notary topology: ${{ matrix.coordinate }}"
    needs: submit-product
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - P-notarized-stapled-app-private-zip|macos-aarch64
          - P-notarized-stapled-app-private-zip|macos-x64
          - P-notarized-stapled-dmg|macos-aarch64
          - P-notarized-stapled-dmg|macos-x64
          - P-notarized-stapled-pkg|macos-aarch64
          - P-notarized-stapled-pkg|macos-x64
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  clean-host:
    name: "Inert clean-host topology: ${{ matrix.coordinate }}"
    needs: continue-notary
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - G-app|macos-aarch64
          - G-app|macos-x64
          - G-dmg|macos-aarch64
          - G-dmg|macos-x64
          - G-pkg|macos-aarch64
          - G-pkg|macos-x64
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  verdict:
    name: "Inert verdict topology: ${{ matrix.coordinate }}"
    needs:
      - native
      - sign-app
      - continue-notary
      - clean-host
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - A0
          - A1
          - A2
          - A3
          - A4
          - A5
          - A6
          - A7
          - A8
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  final-verdict:
    name: "Inert final-verdict topology: ${{ matrix.coordinate }}"
    needs:
      - native
      - sign-app
      - continue-notary
      - clean-host
      - verdict
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        coordinate:
          - A9
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78

  aggregate:
    name: Inert aggregate topology
    needs: final-verdict
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Unreachable while Apple hosted execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          exit 78
