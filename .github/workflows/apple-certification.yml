name: Apple certification

on:
  workflow_dispatch:
    inputs:
      candidateWorkflowRunId:
        description: Exact successful candidate workflow run ID
        required: true
        type: string
      candidateWorkflowRunAttempt:
        description: Exact successful candidate workflow run attempt
        required: true
        type: string
      descriptorArtifactId:
        description: Exact candidate descriptor artifact ID
        required: true
        type: string
      descriptorArtifactDigest:
        description: Exact candidate descriptor REST digest
        required: true
        type: string
      payloadArtifactId:
        description: Exact candidate payload artifact ID
        required: true
        type: string
      payloadArtifactDigest:
        description: Exact candidate payload REST digest
        required: true
        type: string

concurrency:
  group: effect-build-apple-certification-v0.5.0
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CANDIDATE_WORKFLOW_RUN_ID: ${{ inputs.candidateWorkflowRunId }}
  CANDIDATE_WORKFLOW_RUN_ATTEMPT: ${{ inputs.candidateWorkflowRunAttempt }}
  DESCRIPTOR_ARTIFACT_ID: ${{ inputs.descriptorArtifactId }}
  DESCRIPTOR_ARTIFACT_DIGEST: ${{ inputs.descriptorArtifactDigest }}
  PAYLOAD_ARTIFACT_ID: ${{ inputs.payloadArtifactId }}
  PAYLOAD_ARTIFACT_DIGEST: ${{ inputs.payloadArtifactDigest }}

jobs:
  admission:
    name: Admit an exact first-attempt main run
    runs-on: ubuntu-24.04
    steps:
      - name: Reject reruns, non-main refs, and malformed immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CANDIDATE_WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$DESCRIPTOR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DESCRIPTOR_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PAYLOAD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PAYLOAD_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

  distribution:
    needs: admission
    name: Distribution ${{ matrix.scenario }} | ${{ matrix.target.token }}
    environment: apple-certification
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario:
          - developer-id-sign-bun-executable
          - developer-id-sign-deno-executable
          - developer-id-sign-node-sea-executable
          - notarized-stapled-app-bundle
          - notarized-zip-transport
          - notarized-stapled-disk-image
          - notarized-stapled-installer-package
        target:
          - token: macos-x64
            runner: '["self-hosted","effect-build-apple-distribution","macOS","X64"]'
          - token: macos-aarch64
            runner: '["self-hosted","effect-build-apple-distribution","macOS","ARM64"]'
    runs-on: ${{ fromJSON(matrix.target.runner) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Run the credential-backed coordinate through the pre-provisioned harness
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EFFECT_BUILD_APPLE_CERTIFIER: ${{ vars.EFFECT_BUILD_APPLE_CERTIFIER }}
          EFFECT_BUILD_APPLE_APPLICATION_FINGERPRINT: ${{ vars.EFFECT_BUILD_APPLE_APPLICATION_FINGERPRINT }}
          EFFECT_BUILD_APPLE_INSTALLER_FINGERPRINT: ${{ vars.EFFECT_BUILD_APPLE_INSTALLER_FINGERPRINT }}
          EFFECT_BUILD_APPLE_TEAM_ID: ${{ vars.EFFECT_BUILD_APPLE_TEAM_ID }}
          EFFECT_BUILD_APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ vars.EFFECT_BUILD_APPLE_NOTARY_KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          export CHECKED_OUT_SOURCE_SHA="$(git rev-parse HEAD)"
          node scripts/apple-certification/run-harness.mjs \
            --category distribution \
            --coordinate '${{ matrix.scenario }}|${{ matrix.target.token }}' \
            --output apple-coordinate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-certification-distribution-${{ strategy.job-index }}
          path: apple-coordinate/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  clean-host:
    needs: distribution
    name: Clean host ${{ matrix.product }} | ${{ matrix.target.token }}
    environment: apple-certification
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        product: [G-App, G-ZIP, G-DMG, G-PKG]
        target:
          - token: macos-x64
            runner: '["self-hosted","effect-build-apple-clean-host","macOS","X64"]'
          - token: macos-aarch64
            runner: '["self-hosted","effect-build-apple-clean-host","macOS","ARM64"]'
    runs-on: ${{ fromJSON(matrix.target.runner) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: apple-certification-distribution-*
          path: prior-evidence
      - name: Exercise the normal quarantined product flow on a dedicated clean host
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EFFECT_BUILD_APPLE_CERTIFIER: ${{ vars.EFFECT_BUILD_APPLE_CLEAN_HOST_CERTIFIER }}
        run: |
          set -euo pipefail
          export CHECKED_OUT_SOURCE_SHA="$(git rev-parse HEAD)"
          node scripts/apple-certification/run-harness.mjs \
            --category clean-host \
            --coordinate '${{ matrix.product }}|${{ matrix.target.token }}' \
            --prior-evidence prior-evidence \
            --output apple-coordinate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-certification-clean-host-${{ strategy.job-index }}
          path: apple-coordinate/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  certification-cells:
    needs: [distribution, clean-host]
    name: Certification cell ${{ matrix.cell }}
    environment: apple-certification
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cell: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9]
    runs-on: [self-hosted, effect-build-apple-distribution, macOS, ARM64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: apple-certification-*
          path: prior-evidence
      - name: Bind the capability verdict to retained distribution and clean-host evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EFFECT_BUILD_APPLE_CERTIFIER: ${{ vars.EFFECT_BUILD_APPLE_CERTIFIER }}
          EFFECT_BUILD_APPLE_APPLICATION_FINGERPRINT: ${{ vars.EFFECT_BUILD_APPLE_APPLICATION_FINGERPRINT }}
          EFFECT_BUILD_APPLE_INSTALLER_FINGERPRINT: ${{ vars.EFFECT_BUILD_APPLE_INSTALLER_FINGERPRINT }}
          EFFECT_BUILD_APPLE_TEAM_ID: ${{ vars.EFFECT_BUILD_APPLE_TEAM_ID }}
          EFFECT_BUILD_APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ vars.EFFECT_BUILD_APPLE_NOTARY_KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          export CHECKED_OUT_SOURCE_SHA="$(git rev-parse HEAD)"
          node scripts/apple-certification/run-harness.mjs \
            --category cell \
            --coordinate '${{ matrix.cell }}' \
            --prior-evidence prior-evidence \
            --output apple-coordinate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-certification-cell-${{ strategy.job-index }}
          path: apple-coordinate/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  aggregate:
    needs: certification-cells
    name: Authenticate all 32 receipts and retain the exact certification envelope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: apple-certification-*
          path: apple-certification-evidence
      - name: Build the canonical index and opaque redacted bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CHECKED_OUT_SOURCE_SHA="$(git rev-parse HEAD)"
          node scripts/apple-certification/build.mjs apple-certification-evidence apple-certification-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effect-build-v0.5.0-apple-certification
          path: apple-certification-output/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
