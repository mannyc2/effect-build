name: npm Bootstrap (temporary)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character main SHA to diagnose
        required: true
        type: string
      approval:
        description: Explicitly authorize the token identity diagnostic
        required: true
        type: choice
        options:
          - do-not-diagnose
          - diagnose-exact-sha

permissions:
  contents: read

concurrency:
  group: effect-build-npm-bootstrap
  cancel-in-progress: false

jobs:
  environment-contract:
    if: inputs.approval == 'diagnose-exact-sha'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the pre-existing protected npm environment
        shell: bash
        env:
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/repos/$REPOSITORY/environments/npm" \
            > "$stage/environment.json"
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/repos/$REPOSITORY/environments/npm/deployment-branch-policies" \
            > "$stage/branch-policies.json"
          node --input-type=module - "$stage/environment.json" "$stage/branch-policies.json" <<'NODE'
          import { readFileSync } from "node:fs";

          const environment = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const policies = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const reviewers = environment.protection_rules
            ?.filter((rule) => rule.type === "required_reviewers")
            .flatMap((rule) => rule.reviewers ?? [])
            .map(({ reviewer }) => reviewer?.login);
          const branches = policies.branch_policies?.map(({ name, type }) => ({ name, type }));
          if (
            environment.name !== "npm"
            || environment.deployment_branch_policy?.protected_branches !== false
            || environment.deployment_branch_policy?.custom_branch_policies !== true
            || !reviewers?.includes("mannyc2")
            || JSON.stringify(branches) !== JSON.stringify([{ name: "main", type: "branch" }])
          ) {
            console.error("npm environment is absent or does not have the required reviewer/main-only policy");
            process.exit(1);
          }
          NODE

  diagnose:
    if: inputs.approval == 'diagnose-exact-sha'
    needs: environment-contract
    environment: npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Admit exact current main
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be one full lowercase Git SHA" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk '{ print $1 }')"
          if [[ "$actual_sha" != "$EXPECTED_SHA" || "$main_sha" != "$EXPECTED_SHA" ]]; then
            echo "source_sha, checkout, and current main must be identical" >&2
            exit 1
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require the authorized npm identity
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          observed="$(npx --yes npm@11.11.0 whoami --registry=https://registry.npmjs.org)"
          if [[ "$observed" != "mannyc1" ]]; then
            echo "npm identity mismatch" >&2
            exit 1
          fi
          printf '%s\n' "$observed"
