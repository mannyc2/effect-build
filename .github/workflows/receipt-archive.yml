name: Archive authenticated receipt

on:
  workflow_dispatch:
    inputs:
      receiptClass:
        description: Distinct canonical terminal receipt schema
        required: true
        type: choice
        options: [certification, release]
      producerRunId:
        description: Authenticated producer workflow run ID
        required: true
        type: string
      producerRunAttempt:
        description: Authenticated producer workflow run attempt
        required: true
        type: string
      receiptArtifactId:
        description: Exact GitHub artifact ID containing one canonical receipt
        required: true
        type: string
      receiptArtifactDigest:
        description: Exact sha256 digest reported by the GitHub artifact API
        required: true
        type: string
      certifiedSourceSha:
        description: Immutable source SHA named by the producer and every inner receipt
        required: true
        type: string

concurrency:
  group: effect-build-receipt-archive
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  archive:
    name: Validate hostile receipt transport and fast-forward the orphan evidence ref
    runs-on: ubuntu-24.04
    environment:
      name: receipt-archive
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false

      # No repository checkout occurs. Only this separately approved validator
      # blob is materialized, authenticated, and executed; the certified source
      # and artifact payload are never treated as code.
      - name: Materialize the externally approved validator blob only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RECEIPT_ARCHIVE_VALIDATOR_BLOB_SHA: ${{ vars.RECEIPT_ARCHIVE_VALIDATOR_BLOB_SHA }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { writeFile } from "node:fs/promises";

          const required = (name) => {
            const value = process.env[name];
            if (value === undefined || value.length === 0) throw new Error(`missing ${name}`);
            return value;
          };
          const readBounded = async (response, maximum) => {
            if (response.body === null) throw new Error("validator metadata has no body");
            const declared = response.headers.get("content-length");
            if (declared !== null && (!/^[0-9]+$/u.test(declared) || Number(declared) > maximum)) {
              throw new Error("validator metadata exceeds declared bound");
            }
            const reader = response.body.getReader();
            const chunks = [];
            let total = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              total += value.byteLength;
              if (total > maximum) {
                await reader.cancel();
                throw new Error("validator metadata exceeds streamed bound");
              }
              chunks.push(Buffer.from(value));
            }
            return Buffer.concat(chunks, total);
          };
          const repository = required("GITHUB_REPOSITORY");
          if (repository !== "mannyc2/effect-build") throw new Error("validator repository is not allowlisted");
          const revision = required("GITHUB_WORKFLOW_SHA");
          const approvedBlob = required("RECEIPT_ARCHIVE_VALIDATOR_BLOB_SHA");
          if (!/^[0-9a-f]{40}$/u.test(revision) || !/^[0-9a-f]{40}$/u.test(approvedBlob)) {
            throw new Error("validator revision or blob approval is malformed");
          }
          const path = "scripts/receipt-archive/archive.mjs";
          const response = await fetch(
            `https://api.github.com/repos/${repository}/contents/${path}?ref=${revision}`,
            {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${required("GITHUB_TOKEN")}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
              redirect: "error",
              signal: AbortSignal.timeout(15_000),
            },
          );
          if (!response.ok) throw new Error(`validator GitHub response ${response.status}`);
          const metadataBytes = await readBounded(response, 524_288);
          let metadata;
          try {
            metadata = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(metadataBytes));
          } catch (cause) {
            throw new Error("validator metadata is malformed", { cause });
          }
          if (
            metadata.type !== "file" || metadata.path !== path || metadata.encoding !== "base64"
            || metadata.sha !== approvedBlob || typeof metadata.content !== "string"
          ) throw new Error("validator blob is not the externally approved file");
          const encoded = metadata.content.replace(/\n/gu, "");
          const bytes = Buffer.from(encoded, "base64");
          if (bytes.length === 0 || bytes.length > 262_144 || bytes.toString("base64") !== encoded) {
            throw new Error("validator blob is malformed or exceeds bound");
          }
          const gitBlob = createHash("sha1").update(`blob ${bytes.length}\0`).update(bytes).digest("hex");
          if (gitBlob !== approvedBlob) throw new Error("validator Git blob identity mismatch");
          await writeFile("/tmp/effect-build-receipt-archive.mjs", bytes, { mode: 0o600, flag: "wx" });
          NODE

      - name: Authenticate, validate, and append the deterministic receipt path
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          RECEIPT_CLASS: ${{ inputs.receiptClass }}
          PRODUCER_RUN_ID: ${{ inputs.producerRunId }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producerRunAttempt }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.receiptArtifactId }}
          RECEIPT_ARTIFACT_DIGEST: ${{ inputs.receiptArtifactDigest }}
          CERTIFIED_SOURCE_SHA: ${{ inputs.certifiedSourceSha }}
          RECEIPT_ARCHIVE_PROTECTED_ENVIRONMENT: receipt-archive
          RECEIPT_ARCHIVE_REPOSITORY_ID: ${{ vars.RECEIPT_ARCHIVE_REPOSITORY_ID }}
          RECEIPT_ARCHIVE_ENVIRONMENT_ID: ${{ vars.RECEIPT_ARCHIVE_ENVIRONMENT_ID }}
          RECEIPT_ARCHIVE_RULESET_ID: ${{ vars.RECEIPT_ARCHIVE_RULESET_ID }}
          RECEIPT_ARCHIVE_REVIEWER_ID: ${{ vars.RECEIPT_ARCHIVE_REVIEWER_ID }}
          RECEIPT_ARCHIVE_PRODUCER_CLASS: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_CLASS }}
          RECEIPT_ARCHIVE_PRODUCER_WORKFLOW_ID: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_WORKFLOW_ID }}
          RECEIPT_ARCHIVE_PRODUCER_WORKFLOW_PATH: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_WORKFLOW_PATH }}
          RECEIPT_ARCHIVE_PRODUCER_WORKFLOW_BLOB_SHA: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_WORKFLOW_BLOB_SHA }}
          RECEIPT_ARCHIVE_PRODUCER_EVENT: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_EVENT }}
          RECEIPT_ARCHIVE_PRODUCER_REF: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_REF }}
          RECEIPT_ARCHIVE_PRODUCER_ACTOR_ID: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_ACTOR_ID }}
          RECEIPT_ARCHIVE_PRODUCER_TRIGGERING_ACTOR_ID: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_TRIGGERING_ACTOR_ID }}
          RECEIPT_ARCHIVE_PRODUCER_ARTIFACT_NAME_PREFIX: ${{ vars.RECEIPT_ARCHIVE_PRODUCER_ARTIFACT_NAME_PREFIX }}
          RECEIPT_ARCHIVE_EXPECTED_CONCLUSIONS_SHA256: ${{ vars.RECEIPT_ARCHIVE_EXPECTED_CONCLUSIONS_SHA256 }}
          RECEIPT_ARCHIVE_EXPECTED_INNER_RECEIPT_NAMES_SHA256: ${{ vars.RECEIPT_ARCHIVE_EXPECTED_INNER_RECEIPT_NAMES_SHA256 }}
        run: node /tmp/effect-build-receipt-archive.mjs
