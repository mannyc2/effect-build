name: plan-040-implementation-certification

on:
  push: {}
  pull_request: {}

permissions:
  actions: read
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CERTIFICATION_PROFILE: effect-build/plan040-implementation@1

jobs:
  plan040-implementation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact source
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify exact Bun selection
        run: test "$(bun --version)" = "1.3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: plan040-implementation-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - name: Test the disjoint implementation certification profile
        run: node --test research/post-0.3/implementation/certification-contract.test.mjs
      - name: Run the full Plan 040 verification suite
        run: bun run verify
      - name: Reproduce the R3 evaluator and portable R4 Author laws
        run: bun test research/post-0.3/r3-provider-compatibility.test.ts research/post-0.3/r4-author-laws.test.mjs
      - name: Reproduce the R7 matrix laws
        run: node --test research/post-0.3/r7-matrix-laws.test.mjs
      - name: Exercise the staged external Author adapter
        run: node research/post-0.3/implementation/staged-external-author-adapter.mjs
      - name: Exercise the staged Esbuild lane against real esbuild
        run: node research/post-0.3/implementation/staged-esbuild-adapter.mjs
      - name: Certify the exact Plan 040 implementation head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN040_RECEIPTS_DIR: ${{ runner.temp }}/effect-build-plan040-implementation
        run: node research/post-0.3/implementation/certify-current-head.mjs
      - name: Upload successful Plan 040 implementation certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan040-implementation-certification-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/effect-build-plan040-implementation
          if-no-files-found: error
          retention-days: 90
