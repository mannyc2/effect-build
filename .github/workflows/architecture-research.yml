name: plan-044-candidate-certification

on:
  push:
    branches: [codex/044-hard-cut-certify]

permissions:
  actions: read
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}
  CANDIDATE_REF: refs/heads/codex/044-hard-cut-certify

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Validate the exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_REF" = "$CANDIDATE_REF"
          test "$(bun --version)" = "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Verify ordinary CI and the frozen migration ledger
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/plan044-receipts"
          mkdir -p "$receipt"
          bun run verify 2>&1 | tee "$receipt/verify.log"
          node research/post-0.3/freeze/validate-migration.mjs 2>&1 | tee "$receipt/migration.log"
      - name: Pack once and exercise the exact candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/plan044-candidate"
          receipt="$RUNNER_TEMP/plan044-receipts"
          node scripts/test-built-consumer.mjs --candidate-dir "$candidate" 2>&1 | tee "$receipt/packed-consumers.log"
          node research/post-0.3/implementation/staged-external-author-adapter.mjs --candidate-dir "$candidate" 2>&1 | tee "$receipt/external-author-adapter.log"
          node scripts/verify-candidate.mjs --directory "$candidate" --source "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan044-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plan044-candidate
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan044-candidate-receipts-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plan044-receipts
          if-no-files-found: error
          retention-days: 90

  real-bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs --only bun >> "$GITHUB_OUTPUT"
      - name: Execute every selected Bun support cell
        run: bun run test:integration:v04-bun
        env:
          PLAN041_BUN_EXECUTABLE: ${{ steps.tools.outputs.bun }}
      - name: Verify every admitted Bun target
        run: node scripts/verify-v04-bun-target-support.mjs
        env:
          PLAN041_BUN_EXECUTABLE: ${{ steps.tools.outputs.bun }}

  real-deno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
      - name: Execute every selected Deno support cell
        run: bun run test:integration:v04-deno
        env:
          PLAN042_DENO_EXECUTABLE: ${{ steps.tools.outputs.deno }}
          DENORT_BIN: ${{ steps.tools.outputs.denort }}
          DENO_DIR: ${{ runner.temp }}/plan044-deno-cache
      - name: Verify every admitted Deno target
        run: node scripts/verify-v04-deno-target-support.mjs
        env:
          PLAN042_DENO_EXECUTABLE: ${{ steps.tools.outputs.deno }}
          DENORT_BIN: ${{ steps.tools.outputs.denort }}
          DENO_DIR: ${{ runner.temp }}/plan044-deno-target-cache

  real-node-sea:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs --only node >> "$GITHUB_OUTPUT"
      - name: Execute the exact Node SEA support cell
        run: bun run test:integration:v04-node-sea
        env:
          PLAN043_NODE_EXECUTABLE: ${{ steps.tools.outputs.node }}

  windows-lifecycle:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Exercise the actual open-image lock and descendant-termination gate
        shell: pwsh
        run: node scripts/verify-windows-candidate.mjs
      - name: Exercise the executable publication law on Windows
        shell: pwsh
        run: bun test research/post-0.3/r4-author-laws.test.mjs

  certify:
    needs: [candidate, real-bun, real-deno, real-node-sea, windows-lifecycle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plan044-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plan044-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plan044-candidate-receipts-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plan044-receipts
      - name: Fail closed on the complete exact-head evidence set
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          BUN_RESULT: ${{ needs.real-bun.result }}
          DENO_RESULT: ${{ needs.real-deno.result }}
          NODE_SEA_RESULT: ${{ needs.real-node-sea.result }}
          WINDOWS_RESULT: ${{ needs.windows-lifecycle.result }}
        run: |
          set -euo pipefail
          gates="$(node -e 'process.stdout.write(JSON.stringify({"ordinary-ci": process.env.CANDIDATE_RESULT, "migration-ledger": process.env.CANDIDATE_RESULT, "packed-consumers": process.env.CANDIDATE_RESULT, "external-author-adapter": process.env.CANDIDATE_RESULT, "real-bun": process.env.BUN_RESULT, "real-deno": process.env.DENO_RESULT, "real-node-sea": process.env.NODE_SEA_RESULT, "windows-lifecycle": process.env.WINDOWS_RESULT}))')"
          node research/post-0.3/implementation/certify-plan044-candidate.mjs \
            --source "$SOURCE_SHA" \
            --candidate-dir "$RUNNER_TEMP/plan044-candidate" \
            --receipts-dir "$RUNNER_TEMP/plan044-receipts" \
            --remote-ref "$CANDIDATE_REF" \
            --gate-results "$gates"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan044-candidate-certification-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plan044-receipts
          if-no-files-found: error
          retention-days: 90
