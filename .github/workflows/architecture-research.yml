name: post-0.3-architecture-research

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  executable-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate checked-out source and initialize receipts
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$EXPECTED_SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -f research/post-0.3/expected-conclusions.json
          test -f research/post-0.3/validate-receipts.mjs
          echo "SOURCE_SHA=$EXPECTED_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "RESEARCH_RECEIPTS_DIR=$RUNNER_TEMP/effect-build-architecture-receipts" >> "$GITHUB_ENV"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 25.5.0
          package-manager-cache: false
      - id: node25
        name: Capture Node 25 assembler
        shell: bash
        run: |
          test "$(node --version)" = "v25.5.0"
          echo "path=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture Node 26 assembler
        shell: bash
        run: |
          test "$(node --version)" = "v26.7.0"
          echo "path=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - id: bun-current
        name: Capture current Bun host and command
        shell: bash
        run: echo "path=$(command -v bun)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: architecture-research-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.5
      - id: deno-current
        name: Capture current Deno command
        shell: bash
        run: echo "path=$(command -v deno)" >> "$GITHUB_OUTPUT"
      - name: Install comparison providers outside the workspace
        shell: bash
        run: |
          external="$RUNNER_TEMP/effect-build-research-external"
          mkdir -p "$external"
          npm install --prefix "$external" --no-save --omit=dev --no-audit --no-fund \
            rolldown@1.2.4 rolldown-plugin-dts@0.28.2 @yao-pkg/pkg@6.22.0 \
            esbuild-0281@npm:esbuild@0.28.1 esbuild-0282@npm:esbuild@0.28.2 typescript@6.0.3
          echo "RESEARCH_EXTERNAL_NODE_MODULES=$external/node_modules" >> "$GITHUB_ENV"
      - name: Run architecture law tests
        run: node --test research/post-0.3/*.test.mjs
      - name: Type-check current contract prototypes
        run: >-
          bun x tsc --ignoreConfig --noEmit --strict --skipLibCheck
          --module NodeNext --moduleResolution NodeNext --target ES2022
          research/post-0.3/contracts.ts
          research/post-0.3/contracts.typecheck.ts
      - name: Compile exact final research contracts
        run: bun x tsc -p research/post-0.3/final/tsconfig.json
      - name: Execute exact compatibility laws
        run: node research/post-0.3/final/dist/compatibility.test.js
      - name: Reproduce all existing architectural conclusions
        shell: bash
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_BUN_CURRENT_BIN: ${{ steps.bun-current.outputs.path }}
          EFFECT_BUILD_DENO_BIN: ${{ steps.tools.outputs.deno }}
          EFFECT_BUILD_DENO_CURRENT_BIN: ${{ steps.deno-current.outputs.path }}
          EFFECT_BUILD_DENORT_BIN: ${{ steps.tools.outputs.denort }}
          EFFECT_BUILD_NODE_25_BIN: ${{ steps.node25.outputs.path }}
          EFFECT_BUILD_NODE_26_BIN: ${{ steps.node26.outputs.path }}
          RESEARCH_EXTERNAL_NODE_MODULES: ${{ env.RESEARCH_EXTERNAL_NODE_MODULES }}
        run: |
          node research/post-0.3/certify-provider-conformance.mjs
          node research/post-0.3/certify-host-boundaries.mjs
          node research/post-0.3/certify-external-providers.mjs
          node research/post-0.3/certify-profile-refinement.mjs
          node research/post-0.3/certify-version-boundaries.mjs
          node research/post-0.3/certify-node-sea-relations.mjs
          node research/post-0.3/certify-independent-versioning.mjs
      - name: Validate the complete conclusion set
        run: node research/post-0.3/validate-receipts.mjs
      - name: Upload structured architecture receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-0.3-architecture-receipts-${{ env.SOURCE_SHA }}
          path: ${{ env.RESEARCH_RECEIPTS_DIR }}
          if-no-files-found: warn
          retention-days: 30
