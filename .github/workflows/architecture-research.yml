name: post-0.3-architecture-research

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  executable-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -f research/post-0.3/architecture-laws.test.mjs
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture exact Node SEA builder
        shell: bash
        run: |
          test "$(node --version)" = "v26.7.0"
          echo "path=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: architecture-research-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
      - name: Run architecture laws
        run: node --test research/post-0.3/architecture-laws.test.mjs
      - name: Type-check competing contracts and consumers
        run: >-
          bun x tsc --noEmit --strict --skipLibCheck
          --module NodeNext --moduleResolution NodeNext --target ES2022
          research/post-0.3/contracts.ts
          research/post-0.3/contracts.typecheck.ts
      - name: Prove independent provider package versioning
        run: node research/post-0.3/independent-versioning.mjs
      - name: Exercise current providers and candidate profiles
        run: node research/post-0.3/provider-conformance.mjs
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_DENO_BIN: ${{ steps.tools.outputs.deno }}
          EFFECT_BUILD_DENORT_BIN: ${{ steps.tools.outputs.denort }}
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}
          DENORT_BIN: ${{ steps.tools.outputs.denort }}
      - name: Exercise Bun host API lifecycle
        run: bun research/post-0.3/bun-host-probe.mjs
      - name: Exercise Deno host API success and permissions
        shell: bash
        env:
          DENO_BIN: ${{ steps.tools.outputs.deno }}
        run: |
          root="$RUNNER_TEMP/deno-host-research"
          mkdir -p "$root/out"
          printf '%s\n' 'export const value: string = "deno-host";' > "$root/main.ts"
          "$DENO_BIN" run --unstable-bundle --allow-read="$root" --allow-write="$root/out" \
            research/post-0.3/deno-host-probe.ts success "$root/main.ts" "$root/out"
          "$DENO_BIN" run --unstable-bundle \
            research/post-0.3/deno-host-probe.ts permission "$root/main.ts"
      - name: Install comparison providers outside the workspace
        shell: bash
        run: |
          external="$RUNNER_TEMP/effect-build-research-external"
          mkdir -p "$external"
          npm install --prefix "$external" --no-save --omit=dev --no-audit --no-fund \
            rolldown@1.2.4 @yao-pkg/pkg@6.22.0
          echo "RESEARCH_EXTERNAL_NODE_MODULES=$external/node_modules" >> "$GITHUB_ENV"
      - name: Exercise Rolldown and pkg comparison adapters
        shell: bash
        env:
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}
        run: |
          "${{ steps.node26.outputs.path }}" research/post-0.3/external-provider-probe.mjs
