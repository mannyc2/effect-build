name: plan-043-implementation-certification

on:
  push:
    branches:
      - codex/plan043-node-sea-lane

permissions:
  actions: read
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}
  CERTIFICATION_PROFILE: effect-build/plan043-implementation@1

jobs:
  plan043-implementation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact source
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify exact package-manager Bun selection
        run: test "$(bun --version)" = "1.3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: plan043-implementation-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install the frozen workspace
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - name: Test the disjoint implementation certification profile
        run: node --test research/post-0.3/implementation/certification-contract.test.mjs
      - name: Run the full Plan 043 verification suite
        run: bun run verify
      - name: Reproduce the R3 evaluator and portable R4 Author laws
        run: bun test research/post-0.3/r3-provider-compatibility.test.ts research/post-0.3/r4-author-laws.test.mjs
      - name: Reproduce the R7 matrix laws
        run: node --test research/post-0.3/r7-matrix-laws.test.mjs
      - name: Exercise the staged external Author adapter
        run: node research/post-0.3/implementation/staged-external-author-adapter.mjs
      - name: Exercise the frozen Plan 040 Esbuild lane
        run: node research/post-0.3/implementation/staged-esbuild-adapter.mjs
      - id: plan041-bun
        name: Provision the exact content-authenticated Bun provider coordinate
        shell: bash
        run: node scripts/provision-tool-assets.mjs --only bun >> "$GITHUB_OUTPUT"
        env:
          EFFECT_BUILD_TOOL_DIR: ${{ runner.temp }}/effect-build-plan041-bun
      - name: Verify exact content-authenticated Bun provider coordinate
        shell: bash
        env:
          PLAN041_BUN_EXECUTABLE: ${{ steps.plan041-bun.outputs.bun }}
        run: |
          test "${PLAN041_BUN_EXECUTABLE#/}" != "$PLAN041_BUN_EXECUTABLE"
          test -x "$PLAN041_BUN_EXECUTABLE"
          test "$("$PLAN041_BUN_EXECUTABLE" --version)" = "1.3.9"
          echo "PLAN041_BUN_EXECUTABLE=$PLAN041_BUN_EXECUTABLE" >> "$GITHUB_ENV"
      - name: Exercise real Bun scalar behavior
        run: bun run test:integration:v04-bun
      - name: Verify all six Bun targets with independent binary oracles
        run: node scripts/verify-v04-bun-target-support.mjs
      - name: Exercise the nonpublished staged Bun consumer
        run: node research/post-0.3/implementation/staged-bun-adapter.mjs
      - id: deno-tools
        name: Provision exact Deno and denort participants
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
        env:
          EFFECT_BUILD_TOOL_DIR: ${{ runner.temp }}/effect-build-plan042-tools
      - name: Verify exact Deno and denort participant selection
        shell: bash
        env:
          DENO: ${{ steps.deno-tools.outputs.deno }}
          DENORT: ${{ steps.deno-tools.outputs.denort }}
        run: |
          test "${DENO#/}" != "$DENO"
          test "${DENORT#/}" != "$DENORT"
          test -x "$DENO"
          test -x "$DENORT"
          test "$("$DENO" --version | sed -n '1s/^deno \([^[:space:]]*\).*$/\1/p')" = "2.9.3"
      - name: Exercise real Deno scalar behavior
        run: bun run test:integration:v04-deno
        env:
          PLAN042_DENO_EXECUTABLE: ${{ steps.deno-tools.outputs.deno }}
          DENORT_BIN: ${{ steps.deno-tools.outputs.denort }}
          DENO_DIR: ${{ runner.temp }}/effect-build-plan042-deno-cache
      - name: Verify all six Deno targets with independent binary oracles
        run: node scripts/verify-v04-deno-target-support.mjs
      - name: Exercise the nonpublished staged Deno consumer
        run: node research/post-0.3/implementation/staged-deno-adapter.mjs
        env:
          PLAN042_DENO_EXECUTABLE: ${{ steps.deno-tools.outputs.deno }}
          DENORT_BIN: ${{ steps.deno-tools.outputs.denort }}
          DENO_DIR: ${{ runner.temp }}/effect-build-plan042-deno-consumer-cache
      - id: plan043-node
        name: Provision the exact content-authenticated Node SEA provider coordinate
        shell: bash
        run: node scripts/provision-tool-assets.mjs --only node >> "$GITHUB_OUTPUT"
        env:
          EFFECT_BUILD_TOOL_DIR: ${{ runner.temp }}/effect-build-plan043-node
      - name: Verify exact content-authenticated Node SEA provider coordinate
        shell: bash
        env:
          PLAN043_NODE_EXECUTABLE: ${{ steps.plan043-node.outputs.node }}
        run: |
          test "${PLAN043_NODE_EXECUTABLE#/}" != "$PLAN043_NODE_EXECUTABLE"
          test -x "$PLAN043_NODE_EXECUTABLE"
          test "$("$PLAN043_NODE_EXECUTABLE" --version)" = "v26.7.0"
          grep -qx 'ID=ubuntu' /etc/os-release
          grep -Eq '^VERSION_ID="?24\.04"?$' /etc/os-release
          file "$PLAN043_NODE_EXECUTABLE" | grep -F 'ELF 64-bit LSB' >/dev/null
          file "$PLAN043_NODE_EXECUTABLE" | grep -F 'x86-64' >/dev/null
          readelf -h "$PLAN043_NODE_EXECUTABLE" | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "$PLAN043_NODE_EXECUTABLE" | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
          readelf -l "$PLAN043_NODE_EXECUTABLE" | grep -F 'Requesting program interpreter: /lib64/ld-linux-x86-64.so.2' >/dev/null
          "$PLAN043_NODE_EXECUTABLE" --help | grep -Eq '(^|[[:space:]])--build-sea([=[:space:]]|$)'
          test "$("$PLAN043_NODE_EXECUTABLE" -p 'process.config.variables.single_executable_application')" = "true"
          test "$("$PLAN043_NODE_EXECUTABLE" -p 'process.config.variables.node_use_lief')" = "true"
      - name: Exercise real Node SEA scalar behavior
        run: bun run test:integration:v04-node-sea
        env:
          PLAN043_NODE_EXECUTABLE: ${{ steps.plan043-node.outputs.node }}
      - name: Exercise the nonpublished staged Node SEA consumer
        run: node research/post-0.3/implementation/staged-node-sea-adapter.mjs
        env:
          PLAN043_NODE_EXECUTABLE: ${{ steps.plan043-node.outputs.node }}
      - name: Certify the exact Plan 043 implementation head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN043_RECEIPTS_DIR: ${{ runner.temp }}/effect-build-plan043-implementation
        run: node research/post-0.3/implementation/certify-current-head.mjs
      - name: Upload successful Plan 043 implementation certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan043-implementation-certification-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/effect-build-plan043-implementation
          if-no-files-found: error
          retention-days: 90
