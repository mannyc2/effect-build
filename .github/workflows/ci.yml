name: effect-build

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: node scripts/read-tooling.mjs
      - run: bun run verify

  esbuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun x vitest run test/unit/esbuild-bundle.test.ts test/unit/esbuild-node-sea-pipeline.test.ts
      - run: node scripts/test-built-consumer.mjs --built

  node-sea:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture the exact Node SEA producer
        shell: bash
        run: |
          test "$(node --version)" = "v26.7.0"
          node_path="$(node -p 'process.execPath')"
          test "${node_path#/}" != "$node_path"
          echo "path=$node_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Verify independent orchestrator and producer axes
        shell: bash
        run: |
          producer="${{ steps.node26.outputs.path }}"
          test "$(node --version)" = "v24.14.1"
          test "$(node -p 'process.execPath')" != "$producer"
          test "$("$producer" --version)" = "v26.7.0"
          file -Lb -- "$producer" | grep -E 'ELF 64-bit.*x86-64'
          readelf -hW "$producer" | grep -E 'Machine:.*Advanced Micro Devices X86-64'
          readelf -lW "$producer" | grep -E 'Requesting program interpreter:.*/ld-linux'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run test:integration:node-sea
        env:
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}

  real-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
      - run: bun run verify:real
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_DENO_BIN: ${{ steps.tools.outputs.deno }}
          EFFECT_BUILD_DENO_VERSION: 2.9.3
          EFFECT_BUILD_EXPECTED_TARGET: linux-x64-gnu
          DENORT_BIN: ${{ steps.tools.outputs.denort }}

  target-support:
    strategy:
      fail-fast: false
      matrix:
        compiler: [bun, deno]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node scripts/verify-target-support.mjs --compiler ${{ matrix.compiler }}

  effect-compatibility:
    strategy:
      fail-fast: false
      matrix:
        effect: [4.0.0-beta.104, 4.0.0-rc.108]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: node scripts/verify-effect-compatibility.mjs --effect-version ${{ matrix.effect }}

  publication-hosts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:publication
