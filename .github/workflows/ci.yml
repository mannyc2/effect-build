name: effect-build

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      run_node_target_matrix:
        description: Run all 108 private Node target-finalizer coordinates
        required: true
        type: boolean
        default: false
      run_compatibility_matrix:
        description: Run all 84 non-Apple compatibility coordinates
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify

  integration-bun:
    name: Real bun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:bun

  integration-deno:
    name: Real deno (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:deno

  integration-node-sea:
    name: Real Node SEA (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:node-sea

  integration-apple-local:
    name: Real Apple tools (non-credentialed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:apple

  target-cells:
    name: Target ${{ matrix.compiler }}/${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: bun, target: macos-x64 }
          - { compiler: bun, target: macos-aarch64 }
          - { compiler: bun, target: linux-x64-gnu }
          - { compiler: bun, target: linux-x64-musl }
          - { compiler: bun, target: linux-aarch64-gnu }
          - { compiler: bun, target: windows-x64 }
          - { compiler: deno, target: macos-x64 }
          - { compiler: deno, target: macos-aarch64 }
          - { compiler: deno, target: linux-x64-gnu }
          - { compiler: deno, target: linux-aarch64-gnu }
          - { compiler: deno, target: windows-x64 }
          - { compiler: deno, target: windows-aarch64 }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        if: matrix.compiler == 'deno'
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - name: Compile and validate the cell with independent oracles
        shell: bash
        run: |
          set -euo pipefail
          export EFFECT_BUILD_TARGET_COMPILER='${{ matrix.compiler }}'
          export EFFECT_BUILD_TARGET='${{ matrix.target }}'
          export EFFECT_BUILD_BUN_BIN="$(command -v bun)"
          if [[ '${{ matrix.compiler }}' == 'deno' ]]; then
            export EFFECT_BUILD_DENO_BIN="$(command -v deno)"
          fi
          bun run test:integration:target

  node-main-construct:
    if: github.event_name == 'workflow_dispatch' && inputs.run_node_target_matrix
    name: construct--node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction.token }}--to-${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        producer: [bun-cli, esbuild-api, rolldown-api]
        format: [commonjs, module]
        construction:
          - { token: linux-x64-gnu, runner: ubuntu-24.04 }
          - { token: macos-aarch64, runner: macos-15 }
          - { token: windows-x64, runner: windows-2025 }
        target:
          - macos-x64
          - macos-aarch64
          - linux-x64-gnu
          - linux-aarch64-gnu
          - windows-x64
          - windows-aarch64
    runs-on: ${{ matrix.construction.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install GnuPG on macOS
        if: runner.os == 'macOS'
        run: brew install gnupg
      - name: Install GnuPG on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install gnupg --no-progress -y
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Authenticate exact builder and target base distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .node-finalizer/tools
          node scripts/node-finalizer/verify-node-base.mjs \
            --target '${{ matrix.construction.token }}' \
            --output '.node-finalizer/tools/builder${{ startsWith(matrix.construction.token, 'windows-') && '.exe' || '' }}' \
            > .node-finalizer/builder.json
          node scripts/node-finalizer/verify-node-base.mjs \
            --target '${{ matrix.target }}' \
            --output '.node-finalizer/tools/base${{ startsWith(matrix.target, 'windows-') && '.exe' || '' }}' \
            > .node-finalizer/base.json
      - name: Produce, seal, and construct the private coordinate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/node-finalizer/construct.mjs \
            --producer '${{ matrix.producer }}' \
            --format '${{ matrix.format }}' \
            --construction-host '${{ matrix.construction.token }}' \
            --target '${{ matrix.target }}' \
            --builder "$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('.node-finalizer/builder.json')).executable)")" \
            --base "$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('.node-finalizer/base.json')).executable)")" \
            --output .node-finalizer/constructed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction.token }}--to-${{ matrix.target }}--constructed
          path: |
            .node-finalizer/constructed/*--constructed
            .node-finalizer/constructed/*--constructed.exe
            .node-finalizer/constructed/*--assembler-offer.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  node-main-finalize:
    if: github.event_name == 'workflow_dispatch' && inputs.run_node_target_matrix
    needs: node-main-construct
    name: finalize--node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction_host }}--to-${{ matrix.target.token }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        producer: [bun-cli, esbuild-api, rolldown-api]
        format: [commonjs, module]
        construction_host: [linux-x64-gnu, macos-aarch64, windows-x64]
        target:
          - { token: macos-x64, runner: macos-15-intel }
          - { token: macos-aarch64, runner: macos-15 }
          - { token: linux-x64-gnu, runner: ubuntu-24.04 }
          - { token: linux-aarch64-gnu, runner: ubuntu-24.04-arm }
          - { token: windows-x64, runner: windows-2025 }
          - { token: windows-aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Authenticate input, finalize, inspect, and execute on the exact target
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/node-finalizer/finalize.mjs \
            --producer '${{ matrix.producer }}' \
            --format '${{ matrix.format }}' \
            --construction-host '${{ matrix.construction_host }}' \
            --target '${{ matrix.target.token }}' \
            --output .node-finalizer/finalized
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction_host }}--to-${{ matrix.target.token }}--finalized
          path: .node-finalizer/finalized/*--finalized${{ startsWith(matrix.target.token, 'windows-') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Bind authoritative output artifact into the canonical receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          coordinate='node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction_host }}--to-${{ matrix.target.token }}'
          node scripts/node-finalizer/complete-receipt.mjs \
            --producer '${{ matrix.producer }}' \
            --format '${{ matrix.format }}' \
            --construction-host '${{ matrix.construction_host }}' \
            --target '${{ matrix.target.token }}' \
            --pending ".node-finalizer/finalized/${coordinate}--pending.json" \
            --request ".node-finalizer/finalized/${coordinate}--request.json" \
            --output ".node-finalizer/receipt/${coordinate}--target-finalizer-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction_host }}--to-${{ matrix.target.token }}--receipt
          path: .node-finalizer/receipt/*--target-finalizer-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  node-main-aggregate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_node_target_matrix
    needs: node-main-finalize
    name: Aggregate 108 Node target-finalizer receipts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Reauthenticate all jobs, wrappers, layouts, controls, and returned bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/node-finalizer/aggregate.mjs node-main-target-finalizer-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main-target-finalizer-evidence
          path: node-main-target-finalizer-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  browser-compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compatibility_matrix
    name: browser--${{ matrix.provider }}--${{ matrix.browser.token }}--${{ matrix.host.token }}
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        provider: [bun-cli, esbuild-api, rolldown-api]
        browser:
          - { token: chromium@1234, engine: chromium, revision: '1234' }
          - { token: firefox@1538, engine: firefox, revision: '1538' }
          - { token: webkit@2336, engine: webkit, revision: '2336' }
        host:
          - { token: linux-x64-gnu, runner: ubuntu-24.04 }
          - { token: macos-aarch64, runner: macos-15 }
          - { token: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.host.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install the exact browser revision and Linux system dependencies
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps '${{ matrix.browser.engine }}'
      - name: Install the exact browser revision
        if: runner.os != 'Linux'
        run: bunx playwright install '${{ matrix.browser.engine }}'
      - name: Build, serve, and execute the generation-qualified application
        shell: bash
        env:
          EFFECT_BUILD_BROWSER_PROVIDER: ${{ matrix.provider }}
          EFFECT_BUILD_BROWSER_ENGINE: ${{ matrix.browser.engine }}
          EFFECT_BUILD_BROWSER_REVISION: ${{ matrix.browser.revision }}
          EFFECT_BUILD_CERTIFICATION_HOST: ${{ matrix.host.token }}
        run: |
          set -euo pipefail
          coordinate='browser--${{ matrix.provider }}--${{ matrix.browser.token }}--${{ matrix.host.token }}'
          export EFFECT_BUILD_COMPAT_RECEIPT=".compat/${coordinate}.json"
          bunx vitest run test/integration/static-browser-compatibility.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser--${{ matrix.provider }}--${{ matrix.browser.token }}--${{ matrix.host.token }}--receipt
          path: .compat/browser--${{ matrix.provider }}--${{ matrix.browser.token }}--${{ matrix.host.token }}.json
          if-no-files-found: error
          retention-days: 30

  provider-native-compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compatibility_matrix
    name: native--${{ matrix.tool }}--${{ matrix.host.token }}
    strategy:
      fail-fast: false
      matrix:
        tool: [bun@1.3.14, deno@2.9.5, node@26.7.0, esbuild@0.28.2, rolldown@1.2.5]
        host:
          - { token: linux-x64-gnu, runner: ubuntu-24.04 }
          - { token: macos-aarch64, runner: macos-15 }
          - { token: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.host.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.tool == 'node@26.7.0' && '26.7.0' || '24.14.1' }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        if: matrix.tool == 'deno@2.9.5'
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - name: Execute the exact provider-native public contract
        shell: bash
        env:
          TOOL_CELL: ${{ matrix.tool }}
          CERTIFICATION_HOST: ${{ matrix.host.token }}
        run: |
          set -euo pipefail
          case "$TOOL_CELL" in
            bun@1.3.14) bun run test:integration:bun ;;
            deno@2.9.5) bun run test:integration:deno ;;
            node@26.7.0) bun run test:integration:node-sea ;;
            esbuild@0.28.2) bunx vitest run test/unit/esbuild-build.test.ts test/unit/esbuild-context.test.ts test/unit/esbuild-watch.test.ts ;;
            rolldown@1.2.5) bunx vitest run test/unit/rolldown.test.ts ;;
            *) exit 2 ;;
          esac
          coordinate="native--${TOOL_CELL}--${CERTIFICATION_HOST}"
          mkdir -p .compat
          TOOL_CELL="$TOOL_CELL" CERTIFICATION_HOST="$CERTIFICATION_HOST" RECEIPT=".compat/${coordinate}.json" node --input-type=module -e \
            'import { writeFileSync } from "node:fs"; writeFileSync(process.env.RECEIPT, JSON.stringify({ toolCell: process.env.TOOL_CELL, certificationHost: process.env.CERTIFICATION_HOST }) + "\n", { flag: "wx" })'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native--${{ matrix.tool }}--${{ matrix.host.token }}--receipt
          path: .compat/native--${{ matrix.tool }}--${{ matrix.host.token }}.json
          if-no-files-found: error
          retention-days: 30

  packed-consumer-compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compatibility_matrix
    name: packed--${{ matrix.package }}--effect-${{ matrix.effect }}--${{ matrix.host.token }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        package:
          - effect-build
          - effect-build-apple
          - effect-build-bun
          - effect-build-deno
          - effect-build-esbuild
          - effect-build-node-sea
          - effect-build-rolldown
        effect: [4.0.0-beta.104, 4.0.0-rc.108]
        host:
          - { token: linux-x64-gnu, runner: ubuntu-24.04 }
          - { token: macos-aarch64, runner: macos-15 }
          - { token: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.host.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack once and install the exact candidate coordinate with strict peers
        shell: bash
        run: |
          set -euo pipefail
          coordinate='packed--${{ matrix.package }}--effect-${{ matrix.effect }}--${{ matrix.host.token }}'
          node scripts/test-packed-coordinate.mjs \
            --package '${{ matrix.package }}' \
            --effect '${{ matrix.effect }}' \
            --host '${{ matrix.host.token }}' \
            --receipt ".compat/${coordinate}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed--${{ matrix.package }}--effect-${{ matrix.effect }}--${{ matrix.host.token }}--receipt
          path: .compat/packed--${{ matrix.package }}--effect-${{ matrix.effect }}--${{ matrix.host.token }}.json
          if-no-files-found: error
          retention-days: 30

  compatibility-aggregate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compatibility_matrix
    needs: [browser-compatibility, provider-native-compatibility, packed-consumer-compatibility]
    name: Aggregate 84 non-Apple compatibility receipts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Reauthenticate every coordinate job, wrapper, layout, and receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/aggregate-compatibility.mjs compatibility-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-evidence
          path: compatibility-evidence.json
          if-no-files-found: error
          retention-days: 30
