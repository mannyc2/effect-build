name: effect-build

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify

  integration-bun:
    name: Real bun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:bun

  integration-deno:
    name: Real deno (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:deno

  integration-node-sea:
    name: Real Node SEA (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:node-sea

  target-cells:
    name: Target ${{ matrix.compiler }}/${{ matrix.target }} / build+run
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: bun, target: macos-x64, os: macos-15-intel, execution: native }
          - { compiler: bun, target: macos-aarch64, os: macos-15, execution: native }
          - { compiler: bun, target: linux-x64-gnu, os: ubuntu-24.04, execution: native }
          - { compiler: bun, target: linux-x64-musl, os: ubuntu-24.04, execution: alpine }
          - { compiler: bun, target: linux-aarch64-gnu, os: ubuntu-24.04-arm, execution: native }
          - { compiler: bun, target: windows-x64, os: windows-2025, execution: native }
          - { compiler: deno, target: macos-x64, os: macos-15-intel, execution: native }
          - { compiler: deno, target: macos-aarch64, os: macos-15, execution: native }
          - { compiler: deno, target: linux-x64-gnu, os: ubuntu-24.04, execution: native }
          - { compiler: deno, target: linux-aarch64-gnu, os: ubuntu-24.04-arm, execution: native }
          - { compiler: deno, target: windows-x64, os: windows-2025, execution: native }
          - { compiler: deno, target: windows-aarch64, os: windows-11-arm, execution: native }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        if: matrix.compiler == 'deno'
        with:
          deno-version: v2.4.0
      - run: bun install --frozen-lockfile
      - name: Compile and validate the cell with independent oracles
        shell: bash
        run: |
          set -euo pipefail
          export EFFECT_BUILD_TARGET_COMPILER='${{ matrix.compiler }}'
          export EFFECT_BUILD_TARGET='${{ matrix.target }}'
          export EFFECT_BUILD_TARGET_EXECUTION='${{ matrix.execution }}'
          export EFFECT_BUILD_BUN_BIN="$(bun -e 'console.log(process.execPath)')"
          if [[ '${{ matrix.compiler }}' == 'deno' ]]; then
            export EFFECT_BUILD_DENO_BIN="$(deno eval 'console.log(Deno.execPath())')"
          fi
          if [[ '${{ matrix.execution }}' == 'alpine' ]]; then
            export EFFECT_BUILD_DOCKER_BIN="$(command -v docker)"
          fi
          bun run test:integration:target

  acceptance-archives:
    name: Acceptance / deterministic archives and exact Git tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Bind exact host tools
        shell: bash
        run: |
          set -euo pipefail
          echo "EFFECT_BUILD_GIT_BIN=$(command -v git)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_UNZIP_BIN=$(command -v unzip)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_ZIPINFO_BIN=$(command -v zipinfo)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_TAR_BIN=$(command -v tar)" >> "$GITHUB_ENV"
      - run: bun run acceptance:archives

  acceptance-python:
    name: Acceptance / uv 0.12.0 / ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        backend: [uv-build, poetry-core]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.11
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install checksum-verified uv 0.12.0
        shell: bash
        run: |
          set -euo pipefail
          uv_bin="$(bash scripts/acceptance/install-unix-tool.sh uv "$RUNNER_TEMP/effect-build-tools")"
          echo "EFFECT_BUILD_UV_BIN=$uv_bin" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_PYTHON_BIN=$(command -v python)" >> "$GITHUB_ENV"
      - name: Build both backends and run independent wheel/sdist oracles
        run: bun run acceptance:python -- -t "${{ matrix.backend }} fixture"

  acceptance-nfpm-linux:
    name: Acceptance / nFPM 2.47.0 / ${{ matrix.format }} lifecycle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: deb, file: effect-build-acceptance.deb }
          - { format: rpm, file: effect-build-acceptance.rpm }
          - { format: apk, file: effect-build-acceptance.apk }
          - { format: archlinux, file: effect-build-acceptance.pkg.tar.zst }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install checksum-verified nFPM 2.47.0 and bind the cell
        shell: bash
        run: |
          set -euo pipefail
          nfpm_bin="$(bash scripts/acceptance/install-unix-tool.sh nfpm "$RUNNER_TEMP/effect-build-tools")"
          echo "EFFECT_BUILD_NFPM_BIN=$nfpm_bin" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_DOCKER_BIN=$(command -v docker)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_NFPM_FORMAT=${{ matrix.format }}" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_ACCEPTANCE_OUTDIR=$RUNNER_TEMP/effect-build-package" >> "$GITHUB_ENV"
      - run: bun run acceptance:nfpm:linux
      - name: Inspect, clean-install, execute, and remove in an immutable distribution image
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/acceptance/assert-linux-package.sh \
            '${{ matrix.format }}' \
            "$EFFECT_BUILD_ACCEPTANCE_OUTDIR/${{ matrix.file }}"

  acceptance-sbom:
    name: Acceptance / Syft 1.50.0 / SPDX and CycloneDX
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install checksum-verified Syft 1.50.0
        shell: bash
        run: |
          set -euo pipefail
          syft_bin="$(bash scripts/acceptance/install-unix-tool.sh syft "$RUNNER_TEMP/effect-build-tools")"
          sbom_utility_bin="$(bash scripts/acceptance/install-unix-tool.sh sbom-utility "$RUNNER_TEMP/effect-build-tools")"
          echo "EFFECT_BUILD_SYFT_BIN=$syft_bin" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_SBOM_UTILITY_BIN=$sbom_utility_bin" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_BASH_BIN=$(command -v bash)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_DOCKER_BIN=$(command -v docker)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_ACCEPTANCE_OUTDIR=$RUNNER_TEMP/effect-build-sbom" >> "$GITHUB_ENV"
      - run: bun run acceptance:sbom

  # This is deliberately credential-free AppBundle and direct-tool mechanics
  # evidence. The Developer-ID-gated DMG/pkg release APIs, notarization, stapling,
  # Gatekeeper, and clean-host distribution remain external acceptance.
  acceptance-apple-native:
    name: Acceptance / Apple credential-free mechanics / ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, architecture: arm64 }
          - { os: macos-15-intel, architecture: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Bind exact Xcode and macOS native tools
        shell: bash
        run: |
          set -euo pipefail
          echo "EFFECT_BUILD_CLANG_BIN=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_PLUTIL_BIN=$(command -v plutil)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_LIPO_BIN=$(xcrun --find lipo)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_CODESIGN_BIN=$(xcrun --find codesign)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_HDIUTIL_BIN=$(command -v hdiutil)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_PKGBUILD_BIN=$(command -v pkgbuild)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_PRODUCTBUILD_BIN=$(command -v productbuild)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_PKGUTIL_BIN=$(command -v pkgutil)" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_XCODEBUILD_BIN=$(command -v xcodebuild)" >> "$GITHUB_ENV"
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          macos_version="$(sw_vers -productVersion)"
          macos_build="$(sw_vers -buildVersion)"
          test -n "$xcode_version"
          test -n "$macos_version"
          test -n "$macos_build"
          echo "EFFECT_BUILD_XCODE_VERSION=$xcode_version" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_APPLE_TOOL_VERSION=$macos_version+$macos_build" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_APPLE_HOST_ARCH=${{ matrix.architecture }}" >> "$GITHUB_ENV"
      - run: bun run acceptance:apple

  acceptance-windows-msix:
    name: Acceptance / nFPM MSIX and test-certificate Authenticode
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Bind checksum-verified nFPM and exact Windows SDK tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nfpm = & scripts/acceptance/install-windows-nfpm.ps1 -Destination "$env:RUNNER_TEMP\effect-build-tools"
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64"
          $signTool = Join-Path $sdk "signtool.exe"
          $makeAppx = Join-Path $sdk "makeappx.exe"
          foreach ($tool in @($nfpm, $signTool, $makeAppx)) {
            if (-not [System.IO.Path]::IsPathRooted($tool) -or -not (Test-Path -LiteralPath $tool -PathType Leaf)) {
              throw "required acceptance tool is missing: $tool"
            }
          }
          $signToolBanner = & $signTool /? 2>&1
          if ($LASTEXITCODE -ne 0) { throw "SignTool /? failed: $($signToolBanner -join [Environment]::NewLine)" }
          $signToolMatch = [regex]::Match(
            ($signToolBanner -join [Environment]::NewLine),
            "(?im)^Version\s*:?\s*(10\.0\.26100\.[0-9]+)\s*$"
          )
          if (-not $signToolMatch.Success) {
            throw "the exact Windows SDK SignTool banner did not expose a 10.0.26100.x version"
          }
          $signToolVersion = $signToolMatch.Groups[1].Value
          Write-Host "Bound Windows SDK SignTool $signToolVersion at $signTool"
          "EFFECT_BUILD_NFPM_BIN=$nfpm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EFFECT_BUILD_SIGNTOOL_BIN=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EFFECT_BUILD_SIGNTOOL_VERSION=$signToolVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EFFECT_BUILD_MAKEAPPX_BIN=$makeAppx" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EFFECT_BUILD_ACCEPTANCE_OUTDIR=$env:RUNNER_TEMP\effect-build-msix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build the Windows x64 fixture executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = "$env:RUNNER_TEMP\effect-build-acceptance.exe"
          bun build test/integration/fixtures/windows-cli.ts --compile --outfile $executable
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Bun did not produce the Windows acceptance executable"
          }
          "EFFECT_BUILD_WINDOWS_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Create and trust a runner-local mechanics-only certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $password = "effect-build-acceptance-only"
          $pfx = "$env:RUNNER_TEMP\effect-build-acceptance.pfx"
          $thumbprint = & scripts/acceptance/make-test-certificate.ps1 -OutFile $pfx -Password $password
          "EFFECT_BUILD_TEST_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EFFECT_BUILD_TEST_PFX_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EFFECT_BUILD_TEST_CERT_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EFFECT_BUILD_TIMESTAMP_URL=https://timestamp.digicert.com" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: bun run acceptance:windows
      - name: MakeAppx, timestamp, clean-install, execute, and remove oracles
        shell: pwsh
        run: |
          scripts/acceptance/assert-windows-msix.ps1 `
            -Unsigned "$env:EFFECT_BUILD_ACCEPTANCE_OUTDIR\effect-build-acceptance-unsigned.msix" `
            -Signed "$env:EFFECT_BUILD_ACCEPTANCE_OUTDIR\effect-build-acceptance-signed.msix" `
            -MakeAppx $env:EFFECT_BUILD_MAKEAPPX_BIN `
            -SignTool $env:EFFECT_BUILD_SIGNTOOL_BIN `
            -CertificateThumbprint $env:EFFECT_BUILD_TEST_CERT_THUMBPRINT
      - name: Remove the runner-local test identity
        if: always()
        shell: pwsh
        run: |
          if ($env:EFFECT_BUILD_TEST_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:EFFECT_BUILD_TEST_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:EFFECT_BUILD_TEST_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          if ($env:EFFECT_BUILD_TEST_PFX) {
            Remove-Item -LiteralPath $env:EFFECT_BUILD_TEST_PFX -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath ([System.IO.Path]::ChangeExtension($env:EFFECT_BUILD_TEST_PFX, ".cer")) -Force -ErrorAction SilentlyContinue
          }
