name: effect-build

on:
  push:
    branches-ignore: [evidence/receipts-v1]
  pull_request: {}
  workflow_dispatch:
    inputs:
      run_node_target_matrix:
        description: Run 150 applicable private Node coordinates and account for all 30 rejected coordinates
        required: true
        type: boolean
        default: false
      run_compatibility_matrix:
        description: Run all 146 applicable non-Apple compatibility coordinates
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify

  integration-bun:
    name: Real bun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - shell: bash
        run: |
          set -euo pipefail
          executable="$(command -v bun)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$(cygpath -w "$executable")"; fi
          EFFECT_BUILD_BUN="$executable" bun run test:integration:bun

  integration-deno:
    name: Real deno (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - shell: bash
        run: |
          set -euo pipefail
          executable="$(command -v deno)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$(cygpath -w "$executable")"; fi
          EFFECT_BUILD_DENO="$executable" bun run test:integration:deno

  integration-node-sea:
    name: Real Node SEA (linux-x64-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - shell: bash
        run: EFFECT_BUILD_NODE="$(command -v node)" bun run test:integration:node-sea

  packed-public-node-sea:
    name: Packed public Node SEA (exact Node 26.7 linux-x64-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Authenticate exact Node and execute the operation from packed package bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packed-node-sea/tools
          node scripts/node-finalizer/verify-node-base.mjs \
            --target linux-x64-gnu \
            --output .packed-node-sea/tools/node \
            > .packed-node-sea/node.json
          node scripts/test-built-consumer.mjs \
            --built \
            --node-sea-descriptor .packed-node-sea/node.json \
            --node-sea-receipt .packed-node-sea/public-node-sea-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-public-node-sea-evidence
          path: .packed-node-sea/public-node-sea-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  integration-apple-local:
    name: Real Apple tools (non-credentialed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:apple

  target-cells:
    name: Target ${{ matrix.compiler }}/${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: bun, target: macos-x64 }
          - { compiler: bun, target: macos-aarch64 }
          - { compiler: bun, target: linux-x64-gnu }
          - { compiler: bun, target: linux-x64-musl }
          - { compiler: bun, target: linux-aarch64-gnu }
          - { compiler: bun, target: windows-x64 }
          - { compiler: deno, target: macos-x64 }
          - { compiler: deno, target: macos-aarch64 }
          - { compiler: deno, target: linux-x64-gnu }
          - { compiler: deno, target: linux-aarch64-gnu }
          - { compiler: deno, target: windows-x64 }
          - { compiler: deno, target: windows-aarch64 }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        if: matrix.compiler == 'deno'
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - name: Compile and validate the cell with independent oracles
        shell: bash
        run: |
          set -euo pipefail
          export EFFECT_BUILD_TARGET_COMPILER='${{ matrix.compiler }}'
          export EFFECT_BUILD_TARGET='${{ matrix.target }}'
          export EFFECT_BUILD_BUN_BIN="$(command -v bun)"
          export EFFECT_BUILD_TARGET_RECEIPT='.compiler-target/compiler-target--${{ matrix.compiler }}--${{ matrix.target }}.json'
          if [[ '${{ matrix.compiler }}' == 'deno' ]]; then
            export EFFECT_BUILD_DENO_BIN="$(command -v deno)"
          fi
          bun run test:integration:target
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-target--${{ matrix.compiler }}--${{ matrix.target }}--receipt
          path: .compiler-target/compiler-target--${{ matrix.compiler }}--${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30

  compiler-target-aggregate:
    needs: target-cells
    name: Aggregate 12 compiler-target receipts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Authenticate and aggregate every exact compiler-target receipt
        env:
          EFFECT_BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/aggregate-compiler-targets.mjs compiler-target-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-target-evidence
          path: compiler-target-evidence.json
          if-no-files-found: error
          retention-days: 30

  node-main-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.run_node_target_matrix
    name: Derive applicable Node matrix from contract
    runs-on: ubuntu-24.04
    outputs:
      construction: ${{ steps.matrix.outputs.construction }}
      finalization: ${{ steps.matrix.outputs.finalization }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - id: matrix
        name: Emit the contract-derived 150-coordinate plan
        run: node scripts/node-finalizer/matrix.mjs

  node-main-construct:
    if: github.event_name == 'workflow_dispatch' && inputs.run_node_target_matrix
    needs: node-main-plan
    name: construct--node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction.id }}--to-${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.node-main-plan.outputs.construction) }}
    runs-on: ${{ matrix.construction.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install GnuPG on macOS
        if: runner.os == 'macOS'
        run: brew install gnupg
      - name: Authenticate Git for Windows GnuPG
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg
          command -v gpgv
          command -v tar
          command -v unzip
          gpg --version
          gpgv --version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Authenticate exact builder and target base distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .node-finalizer/tools
          node scripts/node-finalizer/verify-node-base.mjs \
            --target '${{ matrix.construction.system_target }}' \
            --output '.node-finalizer/tools/builder${{ startsWith(matrix.construction.system_target, 'windows-') && '.exe' || '' }}' \
            > .node-finalizer/builder.json
          node scripts/node-finalizer/verify-node-base.mjs \
            --target '${{ matrix.target }}' \
            --output '.node-finalizer/tools/base${{ startsWith(matrix.target, 'windows-') && '.exe' || '' }}' \
            > .node-finalizer/base.json
      - name: Produce, seal, and construct the private coordinate
        shell: bash
        run: |
          set -euo pipefail
          bun_executable="$(command -v bun)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then bun_executable="$(cygpath -w "$bun_executable")"; fi
          node scripts/node-finalizer/construct.mjs \
            --producer '${{ matrix.producer }}' \
            --format '${{ matrix.format }}' \
            --construction-host '${{ matrix.construction.id }}' \
            --target '${{ matrix.target }}' \
            --builder-descriptor .node-finalizer/builder.json \
            --base-descriptor .node-finalizer/base.json \
            --bun "$bun_executable" \
            --output .node-finalizer/constructed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction.id }}--to-${{ matrix.target }}--constructed
          path: |
            .node-finalizer/constructed/*--constructed
            .node-finalizer/constructed/*--constructed.exe
            .node-finalizer/constructed/*--assembler-offer.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  node-main-finalize:
    if: github.event_name == 'workflow_dispatch' && inputs.run_node_target_matrix
    needs: [node-main-plan, node-main-construct]
    name: finalize--node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction_host }}--to-${{ matrix.target.token }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.node-main-plan.outputs.finalization) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Authenticate input, finalize, inspect, and execute on the exact target
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/node-finalizer/finalize.mjs \
            --producer '${{ matrix.producer }}' \
            --format '${{ matrix.format }}' \
            --construction-host '${{ matrix.construction_host }}' \
            --target '${{ matrix.target.token }}' \
            --output .node-finalizer/finalized
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction_host }}--to-${{ matrix.target.token }}--finalized
          path: .node-finalizer/finalized/*--finalized${{ startsWith(matrix.target.token, 'windows-') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Bind authoritative output artifact into the canonical receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          coordinate='node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction_host }}--to-${{ matrix.target.token }}'
          node scripts/node-finalizer/complete-receipt.mjs \
            --producer '${{ matrix.producer }}' \
            --format '${{ matrix.format }}' \
            --construction-host '${{ matrix.construction_host }}' \
            --target '${{ matrix.target.token }}' \
            --pending ".node-finalizer/finalized/${coordinate}--pending.json" \
            --request ".node-finalizer/finalized/${coordinate}--request.json" \
            --output ".node-finalizer/receipt/${coordinate}--target-finalizer-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main--${{ matrix.producer }}--${{ matrix.format }}--from-${{ matrix.construction_host }}--to-${{ matrix.target.token }}--receipt
          path: .node-finalizer/receipt/*--target-finalizer-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  node-main-aggregate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_node_target_matrix
    needs: node-main-finalize
    name: Aggregate 150 applicable Node receipts and 30 contract rejections
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Reauthenticate all jobs, wrappers, layouts, controls, and returned bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/node-finalizer/aggregate.mjs node-main-target-finalizer-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main-target-finalizer-evidence
          path: node-main-target-finalizer-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  browser-compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compatibility_matrix
    name: browser--${{ matrix.provider }}--${{ matrix.browser.token }}--${{ matrix.host.token }}
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        provider: [bun-cli, esbuild-api, rolldown-api]
        browser:
          - { token: chromium@1234, engine: chromium, revision: '1234' }
          - { token: firefox@1538, engine: firefox, revision: '1538' }
          - { token: webkit@2336, engine: webkit, revision: '2336' }
        host:
          - { token: linux-x64, runner: ubuntu-24.04 }
          - { token: linux-arm64, runner: ubuntu-24.04-arm }
          - { token: macos-arm64, runner: macos-15 }
          - { token: macos-x64, runner: macos-15-intel }
          - { token: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.host.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install the exact browser revision and Linux system dependencies
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps '${{ matrix.browser.engine }}'
      - name: Install the exact browser revision
        if: runner.os != 'Linux'
        run: bunx playwright install '${{ matrix.browser.engine }}'
      - name: Produce, lend, serve, and execute the BrowserModulePayload candidate
        shell: bash
        env:
          EFFECT_BUILD_BROWSER_PROVIDER: ${{ matrix.provider }}
          EFFECT_BUILD_BROWSER_ENGINE: ${{ matrix.browser.engine }}
          EFFECT_BUILD_BROWSER_REVISION: ${{ matrix.browser.revision }}
          EFFECT_BUILD_CERTIFICATION_HOST: ${{ matrix.host.token }}
        run: |
          set -euo pipefail
          coordinate='browser--${{ matrix.provider }}--${{ matrix.browser.token }}--${{ matrix.host.token }}'
          EFFECT_BUILD_BUN_BIN="$(command -v bun)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then EFFECT_BUILD_BUN_BIN="$(cygpath -w "$EFFECT_BUILD_BUN_BIN")"; fi
          export EFFECT_BUILD_BUN_BIN
          export EFFECT_BUILD_COMPAT_RECEIPT=".compat/${coordinate}.json"
          bun x vitest run test/integration/browser-module-payload-compatibility.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser--${{ matrix.provider }}--${{ matrix.browser.token }}--${{ matrix.host.token }}--receipt
          path: .compat/browser--${{ matrix.provider }}--${{ matrix.browser.token }}--${{ matrix.host.token }}.json
          if-no-files-found: error
          retention-days: 30

  provider-native-compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compatibility_matrix
    name: native--${{ matrix.cell }}--${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        cell:
          - bun@1.3.14
          - deno@2.9.5
          - node@26.7.0
          - esbuild@0.28.2+node@24.14.1
          - esbuild@0.28.2+bun@1.3.14
          - rolldown@1.2.5+node@24.14.1
          - rolldown@1.2.5+bun@1.3.14
        host: [linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
        exclude:
          - { cell: node@26.7.0, host: linux-arm64 }
          - { cell: node@26.7.0, host: macos-arm64 }
          - { cell: node@26.7.0, host: macos-x64 }
          - { cell: node@26.7.0, host: windows-x64 }
    runs-on: ${{ matrix.host == 'linux-x64' && 'ubuntu-24.04' || matrix.host == 'linux-arm64' && 'ubuntu-24.04-arm' || matrix.host == 'macos-arm64' && 'macos-15' || matrix.host == 'macos-x64' && 'macos-15-intel' || 'windows-2025' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.cell == 'node@26.7.0' && '26.7.0' || '24.14.1' }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        if: matrix.cell == 'deno@2.9.5'
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - name: Execute the exact admitted contract and conditional evidence candidates
        shell: bash
        env:
          PROVIDER_RUNTIME_CELL: ${{ matrix.cell }}
          CERTIFICATION_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          tool_path() {
            local executable
            executable="$(command -v "$1")"
            if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$(cygpath -w "$executable")"; fi
            printf '%s\n' "$executable"
          }
          node scripts/certification-host.mjs "$CERTIFICATION_HOST"
          coordinate="native--${PROVIDER_RUNTIME_CELL}--${CERTIFICATION_HOST}"
          observation_directory=".compat/${coordinate}--observations"
          mkdir -p "$observation_directory"
          export EFFECT_BUILD_PROVIDER_RUNTIME_CELL="$PROVIDER_RUNTIME_CELL"
          export EFFECT_BUILD_CERTIFICATION_HOST="$CERTIFICATION_HOST"
          export EFFECT_BUILD_PROVIDER_EVIDENCE_DIRECTORY="$observation_directory"
          host_runtime='node@24.14.1'
          case "$PROVIDER_RUNTIME_CELL" in
            bun@1.3.14)
              host_runtime='bun@1.3.14'
              export EFFECT_BUILD_BUN="$(tool_path bun)"
              bun run test:integration:bun
              ;;
            deno@2.9.5)
              host_runtime='deno@2.9.5'
              export EFFECT_BUILD_DENO="$(tool_path deno)"
              bun run test:integration:deno
              ;;
            node@26.7.0)
              host_runtime='node@26.7.0'
              export EFFECT_BUILD_NODE="$(tool_path node)"
              bun run test:integration:node-sea
              ;;
            esbuild@0.28.2+node@24.14.1)
              EFFECT_BUILD_EXPECTED_HOST_RUNTIME="$host_runtime" node ./node_modules/vitest/vitest.mjs run \
                test/integration/provider-host-runtime.test.ts \
                test/unit/esbuild-build.test.ts \
                test/unit/esbuild-context.test.ts
              node ./node_modules/vitest/vitest.mjs run \
                test/unit/provider-command.test.ts \
                test/integration/provider-command.test.ts \
                -t 'esbuild'
              ;;
            esbuild@0.28.2+bun@1.3.14)
              host_runtime='bun@1.3.14'
              bun run build
              EFFECT_BUILD_EXPECTED_HOST_RUNTIME="$host_runtime" bun test \
                test/integration/provider-host-runtime.test.ts \
                test/unit/esbuild-build.test.ts \
                test/unit/esbuild-context.test.ts
              bun test \
                test/unit/provider-command.test.ts \
                test/integration/provider-command.test.ts \
                -t 'esbuild'
              ;;
            rolldown@1.2.5+node@24.14.1)
              EFFECT_BUILD_EXPECTED_HOST_RUNTIME="$host_runtime" node ./node_modules/vitest/vitest.mjs run \
                test/integration/provider-host-runtime.test.ts \
                test/unit/rolldown.test.ts \
                test/unit/rolldown-api.test.ts
              node ./node_modules/vitest/vitest.mjs run \
                test/unit/provider-command.test.ts \
                test/integration/provider-command.test.ts \
                -t 'Rolldown'
              ;;
            rolldown@1.2.5+bun@1.3.14)
              host_runtime='bun@1.3.14'
              bun run build
              EFFECT_BUILD_EXPECTED_HOST_RUNTIME="$host_runtime" bun test \
                test/integration/provider-host-runtime.test.ts \
                test/unit/rolldown.test.ts \
                test/unit/rolldown-api.test.ts
              bun test \
                test/unit/provider-command.test.ts \
                test/integration/provider-command.test.ts \
                -t 'Rolldown'
              ;;
            *) exit 2 ;;
          esac
          node scripts/provider-native-receipt.mjs \
            "$PROVIDER_RUNTIME_CELL" \
            "$CERTIFICATION_HOST" \
            "$host_runtime" \
            "$observation_directory" \
            ".compat/${coordinate}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native--${{ matrix.cell }}--${{ matrix.host }}--receipt
          path: .compat/native--${{ matrix.cell }}--${{ matrix.host }}.json
          if-no-files-found: error
          retention-days: 30

  packed-consumer-compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compatibility_matrix
    name: packed--${{ matrix.package.name }}--effect-${{ matrix.effect }}--${{ matrix.host.token }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        package:
          - { name: effect-build, admission: release-train }
          - { name: effect-build-apple, admission: release-train }
          - { name: effect-build-bun, admission: release-train }
          - { name: effect-build-deno, admission: release-train }
          - { name: effect-build-esbuild, admission: release-train }
          - { name: effect-build-node-sea, admission: release-train }
          - { name: effect-build-rolldown, admission: conditional-provider-candidate }
        effect: [4.0.0-beta.104, 4.0.0-rc.108]
        host:
          - { token: linux-x64, runner: ubuntu-24.04 }
          - { token: linux-arm64, runner: ubuntu-24.04-arm }
          - { token: macos-arm64, runner: macos-15 }
          - { token: macos-x64, runner: macos-15-intel }
          - { token: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.host.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.package.name == 'effect-build-node-sea' && matrix.host.token == 'linux-x64' && '26.7.0' || '24.14.1' }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        if: matrix.package.name == 'effect-build-deno'
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack once and install the exact candidate coordinate with strict peers
        shell: bash
        run: |
          set -euo pipefail
          coordinate='packed--${{ matrix.package.name }}--effect-${{ matrix.effect }}--${{ matrix.host.token }}'
          node scripts/test-packed-coordinate.mjs \
            --package '${{ matrix.package.name }}' \
            --admission '${{ matrix.package.admission }}' \
            --effect '${{ matrix.effect }}' \
            --host '${{ matrix.host.token }}' \
            --receipt ".compat/${coordinate}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed--${{ matrix.package.name }}--effect-${{ matrix.effect }}--${{ matrix.host.token }}--receipt
          path: .compat/packed--${{ matrix.package.name }}--effect-${{ matrix.effect }}--${{ matrix.host.token }}.json
          if-no-files-found: error
          retention-days: 30

  compatibility-aggregate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compatibility_matrix
    needs: [browser-compatibility, provider-native-compatibility, packed-consumer-compatibility]
    name: Aggregate 146 applicable non-Apple compatibility receipts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Reauthenticate every coordinate job, wrapper, layout, and receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/aggregate-compatibility.mjs compatibility-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-evidence
          path: compatibility-evidence.json
          if-no-files-found: error
          retention-days: 30
