name: effect-build

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-node-24.14.1-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: node scripts/read-tooling.mjs
      - run: bun run audit:dependencies
      - run: bun run verify

  esbuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-node-24.14.1-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: bun run build
      - run: bun x vitest run test/unit/esbuild-bundle.test.ts test/unit/esbuild-node-sea-pipeline.test.ts
      - run: node scripts/test-built-consumer.mjs --built

  node-sea:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture the exact Node SEA producer
        shell: bash
        run: |
          test "$(node --version)" = "v26.7.0"
          node_path="$(node -p 'process.execPath')"
          test "${node_path#/}" != "$node_path"
          echo "path=$node_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Verify independent orchestrator and producer axes
        shell: bash
        env:
          PRODUCER: ${{ steps.node26.outputs.path }}
        run: |
          producer="$PRODUCER"
          test "$(node --version)" = "v24.14.1"
          test "$(node -p 'process.execPath')" != "$producer"
          test "$("$producer" --version)" = "v26.7.0"
          file -Lb -- "$producer" | grep -E 'ELF 64-bit.*x86-64'
          readelf -hW "$producer" | grep -E 'Machine:.*Advanced Micro Devices X86-64'
          readelf -lW "$producer" | grep -E 'Requesting program interpreter:.*/ld-linux'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-node-24.14.1-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: bun run build
      - run: bun run test:integration:node-sea
        env:
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}

  bun-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture the exact Node SEA consumer
        shell: bash
        run: |
          test "$(node --version)" = "v26.7.0"
          node_path="$(node -p 'process.execPath')"
          test "${node_path#/}" != "$node_path"
          echo "path=$node_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-node-24.14.1-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs --only bun >> "$GITHUB_OUTPUT"
      - name: Verify independent package, producer, and consumer axes
        shell: bash
        env:
          SELECTED_BUN: ${{ steps.tools.outputs.bun }}
          SELECTED_NODE: ${{ steps.node26.outputs.path }}
        run: |
          selected_bun="$SELECTED_BUN"
          selected_node="$SELECTED_NODE"
          test "$(bun --version)" = "1.3.14"
          test "$(node --version)" = "v24.14.1"
          test "$(node -p 'process.execPath')" != "$selected_node"
          test "$(command -v bun)" != "$selected_bun"
          test "$("$selected_bun" --version)" = "1.3.9"
          test "$("$selected_bun" --revision)" = "1.3.9+cf6cdbbba"
          test "$("$selected_node" --version)" = "v26.7.0"
          file -Lb -- "$selected_node" | grep -E 'ELF 64-bit.*x86-64'
          readelf -hW "$selected_node" | grep -E 'Machine:.*Advanced Micro Devices X86-64'
          readelf -lW "$selected_node" | grep -E 'Requesting program interpreter:.*/ld-linux'
      - run: bun run test:integration:bun-bundle
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
      - run: bun run test:integration:bun-node-sea
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}

  real-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-node-24.14.1-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
      - run: bun run verify:real
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_DENO_BIN: ${{ steps.tools.outputs.deno }}
          EFFECT_BUILD_DENO_VERSION: 2.9.3
          EFFECT_BUILD_EXPECTED_TARGET: linux-x64-gnu
          DENORT_BIN: ${{ steps.tools.outputs.denort }}

  target-support:
    strategy:
      fail-fast: false
      matrix:
        compiler: [bun, deno]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-node-24.14.1-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: bun run build
      - run: node scripts/verify-target-support.mjs --compiler "$COMPILER"
        env:
          COMPILER: ${{ matrix.compiler }}

  effect-compatibility:
    strategy:
      fail-fast: false
      matrix:
        effect: [4.0.0-beta.104, 4.0.0-rc.108]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: node scripts/verify-effect-compatibility.mjs --effect-version "$EFFECT_VERSION"
        env:
          EFFECT_VERSION: ${{ matrix.effect }}

  publication-hosts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-node-24.14.1-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - run: bun run build
      - run: bun run test:publication
