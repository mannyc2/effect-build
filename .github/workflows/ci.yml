name: effect-build

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # Bun 1.3.14 needs its extraction cache on the checkout's volume on Windows.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-install-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify

  bun:
    name: Tools (Bun ${{ matrix.version }}, Node ${{ matrix.node }}, Git ${{ matrix.git }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '1.3.14', node: '22.0.0', git: '2.40.0' }
          - { version: '1.4.2', node: '26.7.0', git: '2.55.0' }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: echo "EFFECT_BUILD_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install exact native Bun fixture
        env:
          BUN_VERSION: ${{ matrix.version }}
        run: |
          fixture=$(node scripts/install-provider-fixture.mjs bun "$BUN_VERSION")
          echo "EFFECT_BUILD_BUN=$fixture" >> "$GITHUB_ENV"
      - run: bun run test:integration:bun
      - run: bun run test:integration:node-sea
      - name: Build exact Git source fixture and test archives
        env:
          GIT_VERSION: ${{ matrix.git }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y build-essential zlib1g-dev
          EFFECT_BUILD_GIT=$(node scripts/install-provider-fixture.mjs git "$GIT_VERSION")
          export EFFECT_BUILD_GIT
          bun x --no-install vitest run test/unit/archives.test.ts
      - if: matrix.version == '1.3.14'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.11
      - name: Install the tested packaging tools
        if: matrix.version == '1.3.14'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y libarchive-tools
          install_tool() {
            local name="$1" url="$2" digest="$3" member="$4"
            local archive="$RUNNER_TEMP/$name.tar.gz"
            curl --fail --silent --show-error --location "$url" --output "$archive"
            echo "$digest  $archive" | sha256sum --check --status
            tar -xOf "$archive" "$member" > "$RUNNER_TEMP/$name"
            chmod +x "$RUNNER_TEMP/$name"
          }
          install_tool uv https://github.com/astral-sh/uv/releases/download/0.12.0/uv-x86_64-unknown-linux-gnu.tar.gz eaf842262aa1c418d8ecc5605f02ee1ebfd369124fa48548e85f9481a47831a9 uv-x86_64-unknown-linux-gnu/uv
          install_tool nfpm https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 nfpm
          install_tool syft https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788 syft
          echo "EFFECT_BUILD_UV_BIN=$RUNNER_TEMP/uv" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_NFPM_BIN=$RUNNER_TEMP/nfpm" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_SYFT_BIN=$RUNNER_TEMP/syft" >> "$GITHUB_ENV"
          echo "EFFECT_BUILD_PYTHON_BIN=$(command -v python)" >> "$GITHUB_ENV"
      - if: matrix.version == '1.3.14'
        run: bun run test:integration:nfpm && bun run test:integration:python && bun run test:integration:sbom
      - if: matrix.version == '1.3.14'
        run: echo "EFFECT_BUILD_DENO=$(node scripts/install-provider-fixture.mjs deno 2.9.5)" >> "$GITHUB_ENV"
      - if: matrix.version == '1.3.14'
        run: bun run test:integration:deno && bun run --cwd examples/artifact-pipeline test
      - name: Compile the CLI matrix and verify its checksums
        working-directory: examples/cli
        run: |
          bun run test
          (cd dist && sha256sum -c SHA256SUMS)
