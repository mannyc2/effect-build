name: effect-build

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # Bun 1.3.14 needs its extraction cache on the checkout's volume on Windows.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-install-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Select Bun for the executable tests
        shell: bash
        run: echo "EFFECT_BUILD_BUN=$(bun -p 'process.execPath')" >> "$GITHUB_ENV"
      - run: bun run test:integration:bun
      - run: bun run --cwd examples/cli test:compile

  tools:
    name: Real tools (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.11
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install the tested tools
        shell: bash
        run: |
          set -euo pipefail
          install_tool() {
            local name="$1" url="$2" digest="$3" member="$4"
            local archive="$RUNNER_TEMP/$name.tar.gz"
            curl --fail --silent --show-error --location "$url" --output "$archive"
            echo "$digest  $archive" | sha256sum --check --status
            tar -xOf "$archive" "$member" > "$RUNNER_TEMP/$name"
            chmod +x "$RUNNER_TEMP/$name"
          }
          install_tool uv https://github.com/astral-sh/uv/releases/download/0.12.0/uv-x86_64-unknown-linux-gnu.tar.gz eaf842262aa1c418d8ecc5605f02ee1ebfd369124fa48548e85f9481a47831a9 uv-x86_64-unknown-linux-gnu/uv
          install_tool nfpm https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 nfpm
          install_tool syft https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788 syft
          install_tool sbom-utility https://github.com/CycloneDX/sbom-utility/releases/download/v0.19.2/sbom-utility-v0.19.2-linux-amd64.tar.gz e0cd37e6e67b1d0e44dbb7b38e055a4e2ee66db590bb8e7f89e2d9b650f4490b sbom-utility
          {
            echo "EFFECT_BUILD_BUN=$(bun -p 'process.execPath')"
            echo "EFFECT_BUILD_DENO=$(deno eval 'console.log(Deno.execPath())')"
            echo "EFFECT_BUILD_NODE=$(node -p 'process.execPath')"
            echo "EFFECT_BUILD_UV_BIN=$RUNNER_TEMP/uv"
            echo "EFFECT_BUILD_NFPM_BIN=$RUNNER_TEMP/nfpm"
            echo "EFFECT_BUILD_SYFT_BIN=$RUNNER_TEMP/syft"
            echo "EFFECT_BUILD_SBOM_UTILITY_BIN=$RUNNER_TEMP/sbom-utility"
            echo "EFFECT_BUILD_PYTHON_BIN=$(command -v python)"
            echo "EFFECT_BUILD_GIT_BIN=$(command -v git)"
            echo "EFFECT_BUILD_UNZIP_BIN=$(command -v unzip)"
            echo "EFFECT_BUILD_ZIPINFO_BIN=$(command -v zipinfo)"
            echo "EFFECT_BUILD_TAR_BIN=$(command -v tar)"
            echo "EFFECT_BUILD_BASH_BIN=$(command -v bash)"
            echo "EFFECT_BUILD_DOCKER_BIN=$(command -v docker)"
            echo "EFFECT_BUILD_ACCEPTANCE_OUTDIR=$RUNNER_TEMP/artifacts"
          } >> "$GITHUB_ENV"
      - run: bun run test:integration:deno
      - run: bun run test:integration:node-sea
      - run: bun run acceptance:archives
      - run: bun run acceptance:python
      - name: Build each Linux package format
        run: |
          for format in deb rpm apk archlinux; do
            EFFECT_BUILD_NFPM_FORMAT="$format" EFFECT_BUILD_ACCEPTANCE_OUTDIR="$RUNNER_TEMP/packages/$format" bun run acceptance:nfpm:linux
          done
          dpkg-deb --info "$RUNNER_TEMP/packages/deb/effect-build-acceptance.deb"
      - run: bun run acceptance:sbom
