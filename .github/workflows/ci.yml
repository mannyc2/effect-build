name: effect-build

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify

  integration-bun:
    name: Real bun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:bun

  integration-deno:
    name: Real deno (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:deno

  integration-node-sea:
    name: Real Node SEA (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:node-sea

  integration-apple-local:
    name: Real Apple tools (non-credentialed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:apple

  target-cells:
    name: Target ${{ matrix.compiler }}/${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: bun, target: macos-x64 }
          - { compiler: bun, target: macos-aarch64 }
          - { compiler: bun, target: linux-x64-gnu }
          - { compiler: bun, target: linux-x64-musl }
          - { compiler: bun, target: linux-aarch64-gnu }
          - { compiler: bun, target: windows-x64 }
          - { compiler: deno, target: macos-x64 }
          - { compiler: deno, target: macos-aarch64 }
          - { compiler: deno, target: linux-x64-gnu }
          - { compiler: deno, target: linux-aarch64-gnu }
          - { compiler: deno, target: windows-x64 }
          - { compiler: deno, target: windows-aarch64 }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        if: matrix.compiler == 'deno'
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - name: Compile and validate the cell with independent oracles
        shell: bash
        run: |
          set -euo pipefail
          export EFFECT_BUILD_TARGET_COMPILER='${{ matrix.compiler }}'
          export EFFECT_BUILD_TARGET='${{ matrix.target }}'
          export EFFECT_BUILD_BUN_BIN="$(command -v bun)"
          if [[ '${{ matrix.compiler }}' == 'deno' ]]; then
            export EFFECT_BUILD_DENO_BIN="$(command -v deno)"
          fi
          bun run test:integration:target
