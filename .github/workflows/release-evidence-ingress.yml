name: Release evidence ingress

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full lowercase current-main SHA R
        required: true
        type: string
      role:
        description: Exact external readiness evidence role
        required: true
        type: choice
        options:
          - npm-authority
          - operational-journal
          - github-release-governance
      evidence_reference_json:
        description: Compact canonical external-observation reference (maximum 4096 characters)
        required: true
        type: string
      sigstore_bundle_base64:
        description: Canonical Sigstore v0.3 DSSE bundle (maximum 32768 decoded bytes)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: effect-build-release-evidence-ingress-${{ inputs.role }}
  cancel-in-progress: false

jobs:
  ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      workflow: ${{ steps.coordinate.outputs.workflow }}
      source-sha: ${{ steps.coordinate.outputs.source-sha }}
      run-id: ${{ steps.coordinate.outputs.run-id }}
      run-attempt: ${{ steps.coordinate.outputs.run-attempt }}
      artifact-id: ${{ steps.coordinate.outputs.artifact-id }}
      artifact-digest: ${{ steps.coordinate.outputs.artifact-digest }}
      artifact-name: ${{ steps.prepare.outputs.artifact-name }}
      bundle-bytes: ${{ steps.prepare.outputs.bundle-bytes }}
      evidence-observed-at: ${{ steps.prepare.outputs.evidence-observed-at }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Admit the exact current-main source
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" \
            ACTIONS_READ_TOKEN="$ACTIONS_READ_TOKEN" REPOSITORY="$REPOSITORY" SOURCE_SHA="$SOURCE_SHA" \
            node scripts/release/assert-current-main.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install the exact bundle-shape dependency graph
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(bun --version)" == "1.3.14" ]] || exit 1
          node scripts/release/install-frozen-release-dependencies.mjs
      - name: Validate and frame one transport-only external envelope
        id: prepare
        shell: bash
        env:
          EVIDENCE_REFERENCE_JSON: ${{ inputs.evidence_reference_json }}
          EVIDENCE_ROLE: ${{ inputs.role }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/release-evidence-ingress
          SIGSTORE_BUNDLE_BASE64: ${{ inputs.sigstore_bundle_base64 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$(node --version)" == "v24.14.1" ]] || exit 1
          install -d -m 700 "$OUTPUT_DIRECTORY"
          node scripts/release/evidence-ingress-protocol.mjs
          bundle_bytes="$(wc -c < "$OUTPUT_DIRECTORY/sigstore-bundle.json" | tr -d ' ')"
          [[ "$bundle_bytes" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "bundle-bytes=$bundle_bytes" >> "$GITHUB_OUTPUT"
      - name: Upload one transport-only external envelope
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prepare.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-evidence-ingress
          if-no-files-found: error
          retention-days: ${{ steps.prepare.outputs.retention-days }}
          compression-level: 0
      - name: Canonicalize and re-observe the ingress artifact coordinate
        id: coordinate
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.prepare.outputs.artifact-name }}
          EXPECTED_BUNDLE_BYTES: ${{ steps.prepare.outputs.bundle-bytes }}
          EXPECTED_WORKFLOW: ${{ steps.prepare.outputs.workflow }}
          EXPECTED_WORKFLOW_PATH: ${{ steps.prepare.outputs.workflow-path }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPLOAD_ACTION_BARE_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { appendFileSync } from "node:fs";
          import { readFile } from "node:fs/promises";

          import { createGitHubReadOnlyBoundary } from "./scripts/release/github-read-only-boundary.mjs";

          const environment = process.env;
          const contract = JSON.parse(await readFile("tooling/effect-build-contract.json", "utf8"));
          const release = contract.releaseCertification;
          const ingress = release.readiness.externalEvidenceIngress;
          const coordinate = {
            workflow: ingress.workflow,
            sourceSha: environment.SOURCE_SHA,
            runId: environment.RUN_ID,
            runAttempt: environment.RUN_ATTEMPT,
            artifactId: environment.ARTIFACT_ID,
            artifactDigest: `sha256:${environment.UPLOAD_ACTION_BARE_DIGEST}`,
          };
          if (
            environment.REPOSITORY !== release.githubAuthority.repository
            || environment.EXPECTED_WORKFLOW !== ingress.workflow
            || environment.EXPECTED_WORKFLOW_PATH !== ingress.workflowPath
            || !/^[0-9a-f]{40}$/u.test(coordinate.sourceSha)
            || ![coordinate.runId, coordinate.runAttempt, coordinate.artifactId]
              .every((value) => /^[1-9][0-9]*$/u.test(value))
            || !/^sha256:[0-9a-f]{64}$/u.test(coordinate.artifactDigest)
            || !/^[1-9][0-9]*$/u.test(environment.EXPECTED_BUNDLE_BYTES)
          ) throw new Error("external evidence ingress upload coordinate is not canonical");
          const github = createGitHubReadOnlyBoundary({
            repository: release.githubAuthority.repository,
            token: environment.GITHUB_TOKEN,
            transport: release.githubAuthority.readOnlyTransport,
          });
          delete process.env.GITHUB_TOKEN;
          const endpoint = `repos/${release.githubAuthority.repository}`;
          const [artifact, run, main] = await Promise.all([
            github.readJson(`${endpoint}/actions/artifacts/${coordinate.artifactId}`),
            github.readJson(`${endpoint}/actions/runs/${coordinate.runId}/attempts/${coordinate.runAttempt}`),
            github.readJson(`${endpoint}/git/ref/heads/${release.githubAuthority.branchPolicy.name}`),
          ]);
          const bytes = await github.readArtifactZip(
            `${endpoint}/actions/artifacts/${coordinate.artifactId}/zip`,
            release.readiness.zipExtraction.maximumArchiveBytes,
          );
          const terminalMain = await github.readJson(
            `${endpoint}/git/ref/heads/${release.githubAuthority.branchPolicy.name}`,
          );
          if (
            artifact.id !== Number(coordinate.artifactId)
            || artifact.name !== environment.EXPECTED_ARTIFACT_NAME
            || artifact.digest !== coordinate.artifactDigest
            || artifact.expired !== false
            || artifact.workflow_run?.id !== Number(coordinate.runId)
            || artifact.workflow_run?.head_sha !== coordinate.sourceSha
            || artifact.workflow_run?.head_branch !== release.githubAuthority.branchPolicy.name
            || artifact.workflow_run?.repository_id !== Number(release.githubAuthority.repositoryId)
            || artifact.workflow_run?.head_repository_id !== Number(release.githubAuthority.repositoryId)
            || run.id !== Number(coordinate.runId)
            || run.run_attempt !== Number(coordinate.runAttempt)
            || run.path !== ingress.workflowPath
            || run.head_sha !== coordinate.sourceSha
            || run.head_branch !== release.githubAuthority.branchPolicy.name
            || run.event !== ingress.event
            || run.status !== "in_progress"
            || run.conclusion !== null
            || run.repository?.id !== Number(release.githubAuthority.repositoryId)
            || run.head_repository?.id !== Number(release.githubAuthority.repositoryId)
            || main.object?.sha !== coordinate.sourceSha
            || terminalMain.object?.sha !== coordinate.sourceSha
            || createHash("sha256").update(bytes).digest("hex") !== coordinate.artifactDigest.slice(7)
          ) throw new Error("external evidence ingress artifact metadata or bytes changed");
          const outputs = Object.entries({
            workflow: coordinate.workflow,
            "source-sha": coordinate.sourceSha,
            "run-id": coordinate.runId,
            "run-attempt": coordinate.runAttempt,
            "artifact-id": coordinate.artifactId,
            "artifact-digest": coordinate.artifactDigest,
          }).map(([name, value]) => `${name}=${value}`).join("\n");
          appendFileSync(environment.GITHUB_OUTPUT, `${outputs}\n`);
          NODE
