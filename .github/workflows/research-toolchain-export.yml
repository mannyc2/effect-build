name: apply-canonical-architecture-closure

on:
  push:
    branches:
      - codex/post-0.3-native-capability-architecture
    paths:
      - .github/research/APPLY_CANONICAL_CLOSURE

permissions:
  contents: write

jobs:
  apply-canonical-closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/post-0.3-native-capability-architecture
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Reconstruct and apply the reviewed closure patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/research/closure-patch/part-* > "$RUNNER_TEMP/closure.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/closure.patch.gz.b64" > "$RUNNER_TEMP/closure.patch.gz"
          echo "b6de99d6ce6c40fe874edb01e3734905b94d6c18dc757625e89644deeacdfa7a  $RUNNER_TEMP/closure.patch.gz" | sha256sum --check
          gunzip --stdout "$RUNNER_TEMP/closure.patch.gz" > "$RUNNER_TEMP/closure.patch"
          git apply --index "$RUNNER_TEMP/closure.patch"
      - name: Install exact project and research dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun add --no-save \
            semver@7.7.2 @types/semver@7.7.1 \
            parse5@8.0.0 postcss@8.5.6 postcss-value-parser@4.2.0
      - name: Format, regenerate, and type-check the canonical graph
        shell: bash
        run: |
          set -euo pipefail
          bun x dprint fmt
          node research/post-0.3/check-contract-markdown.mjs --write
          bun x dprint fmt research/post-0.3/CANONICAL-CONTRACTS.md
          bun x dprint check
          bun run build
          bun x tsc -p research/post-0.3/canonical/tsconfig.json
          node --test research/post-0.3/canonical/dist/compatibility.test.js
          node --test research/post-0.3/*.test.mjs
          node -e 'import("yaml").then(({parse}) => parse(require("node:fs").readFileSync(".github/workflows/architecture-research.yml", "utf8")))'
      - name: Assert research-only scope and create the substantive commit
        shell: bash
        run: |
          set -euo pipefail
          git restore package.json bun.lock
          rm -rf research/post-0.3/canonical/dist
          rm -rf .github/research/closure-patch
          rm -f .github/research/APPLY_CANONICAL_CLOSURE
          rm -f .github/workflows/research-toolchain-export.yml
          git add -A
          git fetch origin codex/granular-integration-program --depth=1
          if git diff --name-only FETCH_HEAD -- packages package.json bun.lock tooling/public-api.json | grep -q .; then
            echo "production package or export authority changed" >&2
            git diff --name-only FETCH_HEAD -- packages package.json bun.lock tooling/public-api.json >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: consolidate canonical architecture certification"
          git push origin HEAD:codex/post-0.3-native-capability-architecture
