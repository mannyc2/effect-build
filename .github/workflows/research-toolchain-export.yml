name: research-toolchain-export

on:
  push:
    branches:
      - codex/post-0.3-native-capability-architecture

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install exact research-only parser and SemVer dependencies
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          semver@7.7.2 @types/semver@7.7.1
          parse5@8.0.0 postcss@8.5.6 postcss-value-parser@4.2.0
      - name: Archive exact installed toolchain
        shell: bash
        run: tar -czf "$RUNNER_TEMP/effect-build-toolchain.tgz" node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-toolchain-${{ github.sha }}
          path: ${{ runner.temp }}/effect-build-toolchain.tgz
          if-no-files-found: error
          retention-days: 1
