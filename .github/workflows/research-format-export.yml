name: research-format-export

on:
  push: {}

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format research candidates in the isolated checkout
        run: bun x dprint fmt "research/post-0.3/final/*.ts"
      - name: Verify formatter convergence
        run: bun x dprint check "research/post-0.3/final/*.ts"
      - name: Upload canonical formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-final-formatted-${{ github.sha }}
          path: research/post-0.3/final
          if-no-files-found: error
          retention-days: 1
