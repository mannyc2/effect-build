name: Release candidate

on:
  push:
    branches: [main]

concurrency:
  group: effect-build-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  build-pack-test:
    name: Build once, pack once, test exact candidate bytes
    runs-on: ubuntu-24.04
    steps:
      - name: Reject reruns that could duplicate immutable artifact names
        if: github.run_attempt != 1
        run: exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Pack the six admitted packages exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-candidate-payload
          for package in \
            effect-build \
            effect-build-apple \
            effect-build-bun \
            effect-build-deno \
            effect-build-esbuild \
            effect-build-node-sea
          do
            (cd "packages/${package}" && bun pm pack --destination ../../release-candidate-payload)
          done
          test "$(find release-candidate-payload -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = 6
      - name: Authenticate the exact Node 26.7 Linux x64 executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .candidate-node/tools
          node scripts/node-finalizer/verify-node-base.mjs \
            --target linux-x64-gnu \
            --output .candidate-node/tools/node \
            > .candidate-node/node.json
      - name: Test the exact six tarballs and execute their public direct SEA operation
        run: |
          node scripts/test-built-consumer.mjs \
            --built \
            --tarball-directory release-candidate-payload \
            --node-sea-descriptor .candidate-node/node.json \
            --node-sea-receipt .candidate-node/public-node-sea-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effect-build-release-candidate-payload
          path: release-candidate-payload/*.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Bind the checked-out source and authenticated payload wrapper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CHECKED_OUT_SOURCE_SHA="$(git rev-parse HEAD)"
          node scripts/release/build-candidate.mjs \
            release-candidate-payload \
            release-candidate.json \
            .candidate-node/public-node-sea-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effect-build-release-candidate-descriptor
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
