name: GitHub Release governance evidence producer

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full lowercase current-main release source SHA R
        required: true
        type: string

permissions: {}

concurrency:
  group: effect-build-github-release-governance-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main' && inputs.source_sha == github.sha
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      observed-at: ${{ steps.observer.outputs.observed-at }}
      receipt-base64: ${{ steps.observer.outputs.receipt-base64 }}
    steps:
      - name: Stop until the exact isolated observer bootstrap is established
        id: observer
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub Release governance observer STOP: exact isolated Node and observer-source bootstrap not established" >&2
          exit 1

  sign:
    needs: observe
    if: github.ref == 'refs/heads/main' && inputs.source_sha == github.sha
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bundle-base64: ${{ steps.signer.outputs.bundle-base64 }}
      reference-base64: ${{ steps.signer.outputs.reference-base64 }}
    steps:
      - name: Stop until the exact isolated signer bootstrap is established
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub Release governance signer STOP: exact isolated Node and signer-source bootstrap not established" >&2
          exit 1

  upload:
    needs: sign
    if: github.ref == 'refs/heads/main' && inputs.source_sha == github.sha
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialize only the signed handoff bytes
        shell: bash
        env:
          BUNDLE_BASE64: ${{ needs.sign.outputs.bundle-base64 }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/github-release-governance-evidence
          REFERENCE_BASE64: ${{ needs.sign.outputs.reference-base64 }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$OUTPUT_DIRECTORY"
          BUNDLE_BASE64="$BUNDLE_BASE64" OUTPUT_DIRECTORY="$OUTPUT_DIRECTORY" \
            REFERENCE_BASE64="$REFERENCE_BASE64" node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { resolve } from "node:path";

          const decode = (value, label, maximumBytes) => {
            if (
              typeof value !== "string"
              || value.length === 0
              || value.length % 4 !== 0
              || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value)
            ) throw new Error(`${label} is not canonical base64`);
            const bytes = Buffer.from(value, "base64");
            if (
              bytes.length === 0
              || bytes.length > maximumBytes
              || bytes.toString("base64") !== value
            ) {
              throw new Error(`${label} is not canonical base64`);
            }
            return bytes;
          };
          const referenceBytes = decode(process.env.REFERENCE_BASE64, "reference", 4096);
          const bundleBytes = decode(process.env.BUNDLE_BASE64, "bundle", 32768);
          writeFileSync(resolve(process.env.OUTPUT_DIRECTORY, "external-evidence-reference.json"),
            referenceBytes, { flag: "wx", mode: 0o600 });
          writeFileSync(resolve(process.env.OUTPUT_DIRECTORY, "sigstore-bundle.json"),
            bundleBytes, { flag: "wx", mode: 0o600 });
          NODE
      - name: Upload one short-lived handoff envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effect-build-v0.6.0-external-evidence-producer-github-release-governance-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/github-release-governance-evidence
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
