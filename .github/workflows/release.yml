name: Release

# Publishes all five packages with npm provenance after the full CI matrix
# succeeds on main, whenever the lockstep version is not yet on npm.
on:
  workflow_run:
    workflows: [effect-build]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish packages whose version is not on npm
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/effect-build/package.json','utf8')).version")"
          if npm view "effect-build@${version}" version >/dev/null 2>&1; then
            echo "effect-build@${version} is already published; nothing to do"
            exit 0
          fi
          for name in effect-build effect-build-bun effect-build-deno effect-build-esbuild effect-build-node-sea; do
            echo "publishing ${name}@${version}"
            (cd "packages/${name}" && npm publish --provenance --access public)
            sleep 10
          done
