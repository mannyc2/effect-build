name: Release

on:
  workflow_dispatch:
    inputs:
      command:
        description: Candidate preparation or exact prepared publication
        required: true
        default: candidate
        type: choice
        options: [candidate, publish]
      commit:
        description: Exact workflow and candidate source commit
        required: true
        type: string
      candidate_run_id:
        description: Successful candidate workflow run ID; publish only
        required: false
        default: ""
        type: string
      candidate_artifact_id:
        description: Raw candidate artifact ID; publish only
        required: false
        default: ""
        type: string
      candidate_artifact_digest:
        description: Raw candidate artifact sha256 digest; publish only
        required: false
        default: ""
        type: string
      prepared_ref:
        description: Qualified Action prepared:gha reference; publish only
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  candidate-gates:
    if: ${{ inputs.command == 'candidate' }}
    name: Candidate gate (${{ matrix.gate }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gate: quality, runner: ubuntu-24.04 }
          - { gate: esbuild, runner: ubuntu-24.04 }
          - { gate: real-tools, runner: ubuntu-24.04 }
          - { gate: target-bun, runner: ubuntu-24.04 }
          - { gate: target-deno, runner: ubuntu-24.04 }
          - { gate: effect-beta, runner: ubuntu-24.04 }
          - { gate: effect-rc, runner: ubuntu-24.04 }
          - { gate: publication-ubuntu, runner: ubuntu-24.04 }
          - { gate: publication-macos, runner: macos-15 }
          - { gate: publication-windows, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate candidate dispatch authority
        id: source
        shell: bash
        env:
          REQUESTED_COMMAND: ${{ inputs.command }}
          REQUESTED_SOURCE: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMAND" = "candidate"
          test -z "$CANDIDATE_RUN_ID"
          test -z "$CANDIDATE_ARTIFACT_ID"
          test -z "$CANDIDATE_ARTIFACT_DIGEST"
          test -z "$PREPARED_REF"
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid requested source SHA" >&2
            exit 1
          fi
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_REF" = "refs/heads/codex/granular-integration-program"
          test "$WORKFLOW_IDENTITY" = "mannyc2/effect-build/.github/workflows/release.yml@refs/heads/codex/granular-integration-program"
          test "$REPOSITORY" = "mannyc2/effect-build"
          printf 'sha=%s\n' "$REQUESTED_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Validate checked-out candidate source
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ steps.source.outputs.sha }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$WORKFLOW_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source authority" >&2
            exit 1
          fi
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
          test "$(git rev-parse HEAD:packages)" = "9ad55683899ec7447b608cff7997ac5a2572a996"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run the selected closed candidate gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(bun --version)" = "1.3.14"
          case "$GATE" in
            quality)
              node scripts/read-tooling.mjs
              bun run audit:dependencies
              bun run verify
              ;;
            esbuild)
              bun run build
              bun x vitest run test/unit/esbuild-bundle.test.ts test/unit/esbuild-node-sea-pipeline.test.ts
              node scripts/test-built-consumer.mjs --built
              ;;
            real-tools)
              bun run build
              tool_outputs="$RUNNER_TEMP/effect-build-tools"
              node scripts/provision-tool-assets.mjs > "$tool_outputs"
              selected_bun="$(sed -n 's/^bun=//p' "$tool_outputs")"
              selected_deno="$(sed -n 's/^deno=//p' "$tool_outputs")"
              selected_denort="$(sed -n 's/^denort=//p' "$tool_outputs")"
              test "${selected_bun#/}" != "$selected_bun"
              test "${selected_deno#/}" != "$selected_deno"
              test "${selected_denort#/}" != "$selected_denort"
              EFFECT_BUILD_BUN_BIN="$selected_bun" \
                EFFECT_BUILD_DENO_BIN="$selected_deno" \
                EFFECT_BUILD_DENO_VERSION="2.9.3" \
                EFFECT_BUILD_EXPECTED_TARGET="linux-x64-gnu" \
                DENORT_BIN="$selected_denort" \
                bun run verify:real
              ;;
            target-bun)
              bun run build
              node scripts/verify-target-support.mjs --compiler bun
              ;;
            target-deno)
              bun run build
              node scripts/verify-target-support.mjs --compiler deno
              ;;
            effect-beta)
              node scripts/verify-effect-compatibility.mjs --effect-version 4.0.0-beta.104
              ;;
            effect-rc)
              node scripts/verify-effect-compatibility.mjs --effect-version 4.0.0-rc.108
              ;;
            publication-ubuntu|publication-macos|publication-windows)
              bun run build
              bun run test:publication
              ;;
            *)
              echo "unknown candidate gate" >&2
              exit 1
              ;;
          esac

  node-sea:
    if: ${{ inputs.command == 'candidate' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate candidate dispatch authority
        id: source
        shell: bash
        env:
          REQUESTED_COMMAND: ${{ inputs.command }}
          REQUESTED_SOURCE: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMAND" = "candidate"
          test -z "$CANDIDATE_RUN_ID"
          test -z "$CANDIDATE_ARTIFACT_ID"
          test -z "$CANDIDATE_ARTIFACT_DIGEST"
          test -z "$PREPARED_REF"
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid requested source SHA" >&2
            exit 1
          fi
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_REF" = "refs/heads/codex/granular-integration-program"
          test "$WORKFLOW_IDENTITY" = "mannyc2/effect-build/.github/workflows/release.yml@refs/heads/codex/granular-integration-program"
          test "$REPOSITORY" = "mannyc2/effect-build"
          printf 'sha=%s\n' "$REQUESTED_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Validate checked-out candidate source
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ steps.source.outputs.sha }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$WORKFLOW_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source authority" >&2
            exit 1
          fi
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
          test "$(git rev-parse HEAD:packages)" = "9ad55683899ec7447b608cff7997ac5a2572a996"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture the exact Node SEA producer
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.7.0"
          node_path="$(node -p 'process.execPath')"
          test "${node_path#/}" != "$node_path"
          printf 'path=%s\n' "$node_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Verify independent orchestrator and producer axes
        shell: bash
        env:
          PRODUCER: ${{ steps.node26.outputs.path }}
        run: |
          set -euo pipefail
          producer="$PRODUCER"
          test "$(node --version)" = "v24.14.1"
          test "$(node -p 'process.execPath')" != "$producer"
          test "$("$producer" --version)" = "v26.7.0"
          file -Lb -- "$producer" | grep -E 'ELF 64-bit.*x86-64'
          readelf -hW "$producer" | grep -E 'Machine:.*Advanced Micro Devices X86-64'
          readelf -lW "$producer" | grep -E 'Requesting program interpreter:.*/ld-linux'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:integration:node-sea
        env:
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}

  bun-bundle:
    if: ${{ inputs.command == 'candidate' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate candidate dispatch authority
        id: source
        shell: bash
        env:
          REQUESTED_COMMAND: ${{ inputs.command }}
          REQUESTED_SOURCE: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMAND" = "candidate"
          test -z "$CANDIDATE_RUN_ID"
          test -z "$CANDIDATE_ARTIFACT_ID"
          test -z "$CANDIDATE_ARTIFACT_DIGEST"
          test -z "$PREPARED_REF"
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid requested source SHA" >&2
            exit 1
          fi
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_REF" = "refs/heads/codex/granular-integration-program"
          test "$WORKFLOW_IDENTITY" = "mannyc2/effect-build/.github/workflows/release.yml@refs/heads/codex/granular-integration-program"
          test "$REPOSITORY" = "mannyc2/effect-build"
          printf 'sha=%s\n' "$REQUESTED_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Validate checked-out candidate source
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ steps.source.outputs.sha }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$WORKFLOW_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source authority" >&2
            exit 1
          fi
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
          test "$(git rev-parse HEAD:packages)" = "9ad55683899ec7447b608cff7997ac5a2572a996"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture the exact Node SEA consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.7.0"
          node_path="$(node -p 'process.execPath')"
          test "${node_path#/}" != "$node_path"
          printf 'path=%s\n' "$node_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: tools
        run: node scripts/provision-tool-assets.mjs --only bun >> "$GITHUB_OUTPUT"
      - name: Verify independent package, producer, and consumer axes
        shell: bash
        env:
          SELECTED_BUN: ${{ steps.tools.outputs.bun }}
          SELECTED_NODE: ${{ steps.node26.outputs.path }}
        run: |
          set -euo pipefail
          selected_bun="$SELECTED_BUN"
          selected_node="$SELECTED_NODE"
          test "$(bun --version)" = "1.3.14"
          test "$(node --version)" = "v24.14.1"
          test "$(node -p 'process.execPath')" != "$selected_node"
          test "$(command -v bun)" != "$selected_bun"
          test "$("$selected_bun" --version)" = "1.3.9"
          test "$("$selected_bun" --revision)" = "1.3.9+cf6cdbbba"
          test "$("$selected_node" --version)" = "v26.7.0"
          file -Lb -- "$selected_node" | grep -E 'ELF 64-bit.*x86-64'
          readelf -hW "$selected_node" | grep -E 'Machine:.*Advanced Micro Devices X86-64'
          readelf -lW "$selected_node" | grep -E 'Requesting program interpreter:.*/ld-linux'
      - run: bun run test:integration:bun-bundle
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
      - run: bun run test:integration:bun-node-sea
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}

  candidate:
    if: ${{ inputs.command == 'candidate' }}
    needs: [candidate-gates, node-sea, bun-bundle]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-artifact-id: ${{ steps.upload-candidate.outputs.artifact-id }}
      candidate-artifact-digest: sha256:${{ steps.upload-candidate.outputs.artifact-digest }}
      prepared-ref: ${{ steps.prepare.outputs.prepared-ref }}
    steps:
      - name: Validate candidate dispatch authority
        id: source
        shell: bash
        env:
          REQUESTED_COMMAND: ${{ inputs.command }}
          REQUESTED_SOURCE: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMAND" = "candidate"
          test -z "$CANDIDATE_RUN_ID"
          test -z "$CANDIDATE_ARTIFACT_ID"
          test -z "$CANDIDATE_ARTIFACT_DIGEST"
          test -z "$PREPARED_REF"
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid requested source SHA" >&2
            exit 1
          fi
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_REF" = "refs/heads/codex/granular-integration-program"
          test "$WORKFLOW_IDENTITY" = "mannyc2/effect-build/.github/workflows/release.yml@refs/heads/codex/granular-integration-program"
          test "$REPOSITORY" = "mannyc2/effect-build"
          printf 'sha=%s\n' "$REQUESTED_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Validate checked-out candidate source
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ steps.source.outputs.sha }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$WORKFLOW_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source authority" >&2
            exit 1
          fi
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
          test "$(git rev-parse HEAD:packages)" = "9ad55683899ec7447b608cff7997ac5a2572a996"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack once and verify all locked consumers
        shell: bash
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/effect-build-candidate
        run: |
          set -euo pipefail
          node scripts/test-built-consumer.mjs --candidate-dir "$CANDIDATE_DIRECTORY"
      - name: Verify the packed candidate before transfer
        shell: bash
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/effect-build-candidate
          CANDIDATE_SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-candidate.mjs --directory "$CANDIDATE_DIRECTORY" --source "$CANDIDATE_SOURCE"
      - name: Upload the one raw candidate artifact
        id: upload-candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effect-build-0.3.0-candidate
          path: ${{ runner.temp }}/effect-build-candidate
          if-no-files-found: error
          retention-days: 7
      - name: Authenticate the uploaded raw candidate before preparation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_SOURCE: ${{ steps.source.outputs.sha }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: sha256:${{ steps.upload-candidate.outputs.artifact-digest }}
          ARTIFACT_EVIDENCE: ${{ runner.temp }}/effect-build-candidate-artifacts.json
        run: |
          set -euo pipefail
          gh api "/repos/$REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$ARTIFACT_EVIDENCE"
          jq -e \
            --argjson run "$CANDIDATE_RUN_ID" \
            --argjson artifact "$CANDIDATE_ARTIFACT_ID" \
            --arg source "$CANDIDATE_SOURCE" \
            --arg digest "$CANDIDATE_ARTIFACT_DIGEST" \
            '.total_count == 1 and (.artifacts | length) == 1 and .artifacts[0].id == $artifact and .artifacts[0].name == "effect-build-0.3.0-candidate" and .artifacts[0].expired == false and .artifacts[0].digest == $digest and .artifacts[0].workflow_run.id == $run and .artifacts[0].workflow_run.head_branch == "codex/granular-integration-program" and .artifacts[0].workflow_run.head_sha == $source' \
            "$ARTIFACT_EVIDENCE" > /dev/null
      - name: Materialize the exact uploaded candidate for preparation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: sha256:${{ steps.upload-candidate.outputs.artifact-digest }}
          CANDIDATE_ZIP: ${{ runner.temp }}/effect-build-candidate.zip
          CANDIDATE_DIRECTORY: ${{ github.workspace }}/outputs/effect-build-candidate
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$CANDIDATE_DIRECTORY"
          gh api "/repos/$REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > "$CANDIDATE_ZIP"
          test "sha256:$(sha256sum "$CANDIDATE_ZIP" | awk '{print $1}')" = "$CANDIDATE_ARTIFACT_DIGEST"
          unzip -q "$CANDIDATE_ZIP" -d "$CANDIDATE_DIRECTORY"
      - name: Verify the transferred candidate and write release config
        shell: bash
        env:
          CANDIDATE_DIRECTORY: ${{ github.workspace }}/outputs/effect-build-candidate
          CANDIDATE_SOURCE: ${{ steps.source.outputs.sha }}
          RELEASE_CONFIG: ${{ github.workspace }}/outputs/release.config.json
        run: |
          set -euo pipefail
          node scripts/verify-candidate.mjs --directory "$CANDIDATE_DIRECTORY" --source "$CANDIDATE_SOURCE"
          node scripts/write-release-config.mjs --manifest "$CANDIDATE_DIRECTORY/manifest.json" --candidate-directory "outputs/effect-build-candidate" --source "$CANDIDATE_SOURCE" --output "$RELEASE_CONFIG"
          test -z "$(git status --porcelain)"
      - name: Prepare the exact uploaded bytes with the qualified coordinator
        id: prepare
        uses: mannyc2/ts-release/apps/ts-release-action@105b6b5cc39757f5284c30b082e7cfd71b9959b2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: prepare
          config: outputs/release.config.json
      - name: Upload the redacted preparation report
        if: ${{ always() && steps.prepare.outputs.report-ref != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effect-build-0.3.0-prepare-report-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.report-ref }}
          if-no-files-found: error
          retention-days: 7
      - name: Record the safe candidate identities
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.upload-candidate.outputs.artifact-digest }}
          PREPARED_REF: ${{ steps.prepare.outputs.prepared-ref }}
        run: |
          set -euo pipefail
          printf 'candidate_artifact_id=%s\n' "$CANDIDATE_ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          printf 'candidate_artifact_digest=sha256:%s\n' "$CANDIDATE_ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'prepared_ref=%s\n' "$PREPARED_REF" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ inputs.command == 'publish' }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Validate publish dispatch authority
        id: source
        shell: bash
        env:
          REQUESTED_COMMAND: ${{ inputs.command }}
          REQUESTED_SOURCE: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMAND" = "publish"
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid requested source SHA" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || [[ ! "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid candidate identity" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid candidate artifact digest" >&2
            exit 1
          fi
          if [[ ! "$PREPARED_REF" =~ ^prepared:gha:mannyc2/effect-build/runs/[1-9][0-9]*/attempts/[1-9][0-9]*/artifacts/ts-release-prepared-[1-9][0-9]*-[0-9a-f]{64}#sha256-[0-9a-f]{64}$ ]]; then
            echo "invalid prepared reference" >&2
            exit 1
          fi
          case "$PREPARED_REF" in
            "prepared:gha:mannyc2/effect-build/runs/$CANDIDATE_RUN_ID/"*) ;;
            *) echo "prepared reference run differs from candidate run" >&2; exit 1 ;;
          esac
          test "$REQUESTED_SOURCE" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_REF" = "refs/heads/codex/granular-integration-program"
          test "$WORKFLOW_IDENTITY" = "mannyc2/effect-build/.github/workflows/release.yml@refs/heads/codex/granular-integration-program"
          test "$REPOSITORY" = "mannyc2/effect-build"
          printf 'sha=%s\n' "$REQUESTED_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify the qualified publisher runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"
          test "$(bun --version)" = "1.3.14"
      - name: Authenticate and verify the exact candidate release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_SOURCE: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          EVIDENCE_ROOT: ${{ runner.temp }}/effect-build-release-evidence
          CANDIDATE_DIRECTORY: ${{ github.workspace }}/outputs/effect-build-candidate
          VERIFY_RELEASE_ARTIFACT_SHA256: 727b36f6ed36f72598ceb9167464481a604b36894be1e820d592747c6deb3a9b
          VERIFY_CANDIDATE_SHA256: 8a7b9f053e7026cb56c37fbd7ffd6894b93ba883c063fe6d53d6e62e24d8c886
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$EVIDENCE_ROOT/api" "$EVIDENCE_ROOT/report" "$EVIDENCE_ROOT/verifiers" "$CANDIDATE_DIRECTORY"
          gh api "/repos/$REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$EVIDENCE_ROOT/api/run.json"
          gh api "/repos/$REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$EVIDENCE_ROOT/api/artifacts.json"
          gh api "/repos/$REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > "$EVIDENCE_ROOT/api/candidate-artifact.json"
          jq -e --argjson run "$CANDIDATE_RUN_ID" --arg source "$REQUESTED_SOURCE" \
            '.id == $run and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $source and .head_branch == "codex/granular-integration-program" and .path == ".github/workflows/release.yml" and .name == "Release"' \
            "$EVIDENCE_ROOT/api/run.json" > /dev/null
          jq -e --argjson run "$CANDIDATE_RUN_ID" --argjson artifact "$CANDIDATE_ARTIFACT_ID" --arg digest "$CANDIDATE_ARTIFACT_DIGEST" \
            '.id == $artifact and .name == "effect-build-0.3.0-candidate" and .expired == false and .digest == $digest and .workflow_run.id == $run' \
            "$EVIDENCE_ROOT/api/candidate-artifact.json" > /dev/null
          run_attempt="$(jq -er '.run_attempt | select(type == "number" and . >= 1 and floor == .)' "$EVIDENCE_ROOT/api/run.json")"
          report_name="effect-build-0.3.0-prepare-report-$run_attempt"
          report_artifact_id="$(jq -er --arg name "$report_name" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else error("preparation report artifact is not unique") end' "$EVIDENCE_ROOT/api/artifacts.json")"
          report_artifact_digest="$(jq -er --arg name "$report_name" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].digest else error("preparation report artifact is not unique") end' "$EVIDENCE_ROOT/api/artifacts.json")"
          if [[ ! "$report_artifact_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid preparation report artifact ID" >&2
            exit 1
          fi
          if [[ ! "$report_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid preparation report artifact digest" >&2
            exit 1
          fi
          gh api "/repos/$REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > "$EVIDENCE_ROOT/candidate.zip"
          test "sha256:$(sha256sum "$EVIDENCE_ROOT/candidate.zip" | awk '{print $1}')" = "$CANDIDATE_ARTIFACT_DIGEST"
          unzip -q "$EVIDENCE_ROOT/candidate.zip" -d "$CANDIDATE_DIRECTORY"
          gh api "/repos/$REPOSITORY/actions/artifacts/$report_artifact_id/zip" > "$EVIDENCE_ROOT/report.zip"
          test "sha256:$(sha256sum "$EVIDENCE_ROOT/report.zip" | awk '{print $1}')" = "$report_artifact_digest"
          unzip -q "$EVIDENCE_ROOT/report.zip" -d "$EVIDENCE_ROOT/report"
          mapfile -t report_files < <(find "$EVIDENCE_ROOT/report" -type f -name 'action-report.json' -print)
          if [[ "${#report_files[@]}" -ne 1 ]]; then
            echo "preparation report archive does not contain one action-report.json" >&2
            exit 1
          fi
          for verifier in verify-release-artifact.mjs verify-candidate.mjs; do
            metadata="$EVIDENCE_ROOT/verifiers/$verifier.json"
            destination="$EVIDENCE_ROOT/verifiers/$verifier"
            case "$verifier" in
              verify-release-artifact.mjs) expected_sha256="$VERIFY_RELEASE_ARTIFACT_SHA256" ;;
              verify-candidate.mjs) expected_sha256="$VERIFY_CANDIDATE_SHA256" ;;
              *) echo "unreviewed verifier" >&2; exit 1 ;;
            esac
            gh api "/repos/$REPOSITORY/contents/scripts/$verifier?ref=$REQUESTED_SOURCE" > "$metadata"
            test "$(jq -er '.encoding' "$metadata")" = "base64"
            jq -er '.content' "$metadata" | tr -d '\n' | base64 --decode > "$destination"
            test "$(git hash-object "$destination")" = "$(jq -er '.sha' "$metadata")"
            test "$(sha256sum "$destination" | awk '{print $1}')" = "$expected_sha256"
            chmod 0400 "$destination"
          done
          jq -n \
            --slurpfile run "$EVIDENCE_ROOT/api/run.json" \
            --slurpfile artifacts "$EVIDENCE_ROOT/api/artifacts.json" \
            --slurpfile prepare_report "${report_files[0]}" \
            '{run: $run[0], artifacts: $artifacts[0], prepareReport: $prepare_report[0]}' \
            > "$EVIDENCE_ROOT/evidence.json"
          node "$EVIDENCE_ROOT/verifiers/verify-release-artifact.mjs" \
            --evidence "$EVIDENCE_ROOT/evidence.json" \
            --candidate-directory "$CANDIDATE_DIRECTORY" \
            --source "$REQUESTED_SOURCE" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --prepared-ref "$PREPARED_REF"
      - name: Publish only through the qualified ordered coordinator
        id: publish
        uses: mannyc2/ts-release/apps/ts-release-action@105b6b5cc39757f5284c30b082e7cfd71b9959b2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: publish
          prepared: ${{ inputs.prepared_ref }}
      - name: Upload the redacted publication report
        if: ${{ always() && steps.publish.outputs.report-ref != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effect-build-0.3.0-publish-report-${{ github.run_attempt }}
          path: ${{ steps.publish.outputs.report-ref }}
          if-no-files-found: error
          retention-days: 30
