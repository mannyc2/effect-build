name: Release candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the requested workflow source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          test "${#REQUESTED_COMMIT}" -eq 40
          test "$(printf '%s' "${REQUESTED_COMMIT}" | tr -d '0-9a-f')" = ""
          test "${REQUESTED_COMMIT}" = "${DISPATCH_COMMIT}"
          test "$(git rev-parse HEAD)" = "${REQUESTED_COMMIT}"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - id: tools
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
      - run: bun run verify:real
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_DENO_BIN: ${{ steps.tools.outputs.deno }}
          EFFECT_BUILD_DENO_VERSION: 2.9.3
          EFFECT_BUILD_EXPECTED_TARGET: linux-x64-gnu
          DENORT_BIN: ${{ steps.tools.outputs.denort }}
      - run: bun run verify:targets
      - run: bun run verify:effect
      - run: node scripts/test-built-consumer.mjs --candidate-dir "$RUNNER_TEMP/effect-build-candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: effect-build-0.3.0-candidate
          path: ${{ runner.temp }}/effect-build-candidate
          if-no-files-found: error
          retention-days: 7
