name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match the tag to the package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - name: Require the tag to point at the current main commit
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

  quality:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.17.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  node-sea:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture the exact Node SEA producer
        shell: bash
        run: |
          test "$(node --version)" = "v26.7.0"
          node_path="$(node -p 'process.execPath')"
          test "${node_path#/}" != "$node_path"
          echo "path=$node_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Verify independent orchestrator and producer axes
        shell: bash
        run: |
          producer="${{ steps.node26.outputs.path }}"
          test "$(node --version)" = "v24.14.1"
          test "$(node -p 'process.execPath')" != "$producer"
          test "$("$producer" --version)" = "v26.7.0"
          file -Lb -- "$producer" | grep -E 'ELF 64-bit.*x86-64'
          readelf -hW "$producer" | grep -E 'Machine:.*Advanced Micro Devices X86-64'
          readelf -lW "$producer" | grep -E 'Requesting program interpreter:.*/ld-linux'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.17.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:integration:node-sea
        env:
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}

  real-tools:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.17.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - id: tools
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
      - run: pnpm verify:real
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_DENO_BIN: ${{ steps.tools.outputs.deno }}
          EFFECT_BUILD_DENO_VERSION: 2.9.3
          EFFECT_BUILD_EXPECTED_TARGET: linux-x64-gnu
          DENORT_BIN: ${{ steps.tools.outputs.denort }}

  target-support:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        compiler: [bun, deno]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.17.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-target-support.mjs --compiler ${{ matrix.compiler }}

  effect-compatibility:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        effect: [4.0.0-beta.104, 4.0.0-rc.108]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.17.1
          run_install: false
      - run: node scripts/verify-effect-compatibility.mjs --effect-version ${{ matrix.effect }}

  publication-hosts:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.17.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:publication

  publish-npm:
    needs: [quality, node-sea, real-tools, publication-hosts, target-support, effect-compatibility]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.17.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish-npm
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Create the GitHub release
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
