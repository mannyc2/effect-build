name: Release (quarantined)

# Stage 0 disables the unsafe green-main publisher. This manual stub confers no
# release authority and performs no checkout, install, build, pack, or mutation.
on:
  workflow_dispatch:

concurrency:
  group: effect-build-release-v0.5.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coordinator-not-implemented:
    name: Fixed-seven coordinator not implemented
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse publication
        shell: bash
        run: |
          echo "::error::v0.5 publication remains disabled until the exact-prepacked fixed-seven coordinator is implemented and reviewed"
          exit 1
