              [(dns.default ?? dns).promises, Object.keys((dns.default ?? dns).promises ?? {})],
              [(dns.default ?? dns).promises?.Resolver?.prototype, resolverMethods],
              [http.default ?? http, ["Agent", "ClientRequest", "Server", "createServer", "get", "request"]],
              [(http.default ?? http).Agent?.prototype, ["createConnection"]],
              [(http.default ?? http).ClientRequest?.prototype, ["end", "write"]],
              [http2.default ?? http2, ["connect", "createSecureServer", "createServer"]],
              [https.default ?? https, ["Agent", "Server", "createServer", "get", "request"]],
              [(https.default ?? https).Agent?.prototype, ["createConnection"]],
              [net.default ?? net, ["Server", "Socket", "connect", "createConnection", "createServer"]],
              [(net.default ?? net).Socket?.prototype, ["connect"]],
              [(net.default ?? net).Server?.prototype, ["listen"]],
              [tls.default ?? tls, ["Server", "TLSSocket", "connect", "createServer"]],
              [(tls.default ?? tls).TLSSocket?.prototype, ["connect"]],
