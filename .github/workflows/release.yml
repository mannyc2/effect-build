              bundleModulePath,
              protobufModulePath,
              bundlePath,
              trustedRootPath,
              trustedRootBytes,
              trustedRootDigest,
              trustedRootMediaType,
              identity,
              issuer,
              repository,
              sourceSha,
              buildSignerOid,
              sourceRepositoryOid,
              sourceDigestOid,
