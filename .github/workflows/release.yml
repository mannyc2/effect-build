name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# Different versions share npm's mutable latest tags, so serialize the complete release flow.
concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

env:
  NODE_VERSION: 24.14.1
  BUN_VERSION: 1.3.14

jobs:
  candidate:
    name: Build the release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      manifest-sha256: ${{ steps.pack.outputs.manifest-sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Reuse successful main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --event push --branch main --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$run_id" || { echo "No main CI run exists for $GITHUB_SHA" >&2; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Pack every public workspace once
        id: pack
        run: node scripts/release/pack-candidate.mjs "$RUNNER_TEMP/candidate" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: npm-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      # Downstream jobs use this upload's ID, preserving the original bytes on partial reruns.

  consumers:
    name: Consume candidate (${{ matrix.os }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANDIDATE_SHA256: ${{ needs.candidate.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Install, typecheck and execute the exact candidate in Node and Bun
        shell: bash
        run: |
          node scripts/test-built-consumer.mjs --candidate "$RUNNER_TEMP/candidate"
          bun scripts/test-built-consumer.mjs --candidate "$RUNNER_TEMP/candidate"

  publish:
    name: Publish candidate bytes
    needs: [candidate, consumers]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      CANDIDATE_SHA256: ${{ needs.candidate.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
      # Node 24.14.1 includes npm 11.11.0. No workspace dependencies are installed here.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Authenticate every missing package, publish, and reconcile the registry
        run: node scripts/release/publish.mjs "$RUNNER_TEMP/candidate"

  verify:
    name: Verify published packages
    needs: [candidate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CANDIDATE_SHA256: ${{ needs.candidate.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Verify downloaded bytes and their signed provenance
        run: node scripts/release/verify-published.mjs "$RUNNER_TEMP/candidate"
      - name: Exercise a fresh public-registry consumer
        run: node scripts/test-built-consumer.mjs --registry "${{ needs.candidate.outputs.version }}"

  github-release:
    name: Publish the GitHub Release
    needs: [candidate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CANDIDATE_SHA256: ${{ needs.candidate.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Attach the verified candidate and publish an immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/github-release.mjs "$RUNNER_TEMP/candidate"
