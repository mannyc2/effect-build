name: Release candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  esbuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun x vitest run test/unit/esbuild-bundle.test.ts test/unit/esbuild-node-sea-pipeline.test.ts

  node-sea:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - id: node26
        name: Capture the exact Node SEA producer
        shell: bash
        run: |
          test "$(node --version)" = "v26.7.0"
          node_path="$(node -p 'process.execPath')"
          test "${node_path#/}" != "$node_path"
          echo "path=$node_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Verify independent orchestrator and producer axes
        shell: bash
        run: |
          producer="${{ steps.node26.outputs.path }}"
          test "$(node --version)" = "v24.14.1"
          test "$(node -p 'process.execPath')" != "$producer"
          test "$("$producer" --version)" = "v26.7.0"
          file -Lb -- "$producer" | grep -E 'ELF 64-bit.*x86-64'
          readelf -hW "$producer" | grep -E 'Machine:.*Advanced Micro Devices X86-64'
          readelf -lW "$producer" | grep -E 'Requesting program interpreter:.*/ld-linux'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:integration:node-sea
        env:
          EFFECT_BUILD_NODE_SEA_BIN: ${{ steps.node26.outputs.path }}

  candidate:
    needs: [esbuild, node-sea]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the requested workflow source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          test "${#REQUESTED_COMMIT}" -eq 40
          test "$(printf '%s' "${REQUESTED_COMMIT}" | tr -d '0-9a-f')" = ""
          test "${REQUESTED_COMMIT}" = "${DISPATCH_COMMIT}"
          test "$(git rev-parse HEAD)" = "${REQUESTED_COMMIT}"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - id: tools
        run: node scripts/provision-tool-assets.mjs >> "$GITHUB_OUTPUT"
      - run: bun run verify:real
        env:
          EFFECT_BUILD_BUN_BIN: ${{ steps.tools.outputs.bun }}
          EFFECT_BUILD_DENO_BIN: ${{ steps.tools.outputs.deno }}
          EFFECT_BUILD_DENO_VERSION: 2.9.3
          EFFECT_BUILD_EXPECTED_TARGET: linux-x64-gnu
          DENORT_BIN: ${{ steps.tools.outputs.denort }}
      - run: bun run verify:targets
      - run: bun run verify:effect
      - run: node scripts/test-built-consumer.mjs --candidate-dir "$RUNNER_TEMP/effect-build-candidate"
      - run: node scripts/verify-candidate.mjs --directory "$RUNNER_TEMP/effect-build-candidate" --source "${{ inputs.commit }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: effect-build-0.3.0-candidate
          path: ${{ runner.temp }}/effect-build-candidate
          if-no-files-found: error
          retention-days: 7
