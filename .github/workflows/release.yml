name: Release

# Candidate preparation, credential certification, and byte publication are
# separate exact-coordinate acts. Ordinary CI never mutates npm.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact release protocol mode
        required: true
        type: choice
        options:
          - prepare-exact-sha
          - certify-exact-sha
          - publish-certified-bytes
      source_sha:
        description: Full lowercase current-main commit SHA
        required: true
        type: string
      candidate_run_id:
        description: Exact successful candidate workflow run ID
        required: false
        type: string
      candidate_run_attempt:
        description: Exact successful candidate workflow run attempt
        required: false
        type: string
      candidate_artifact_id:
        description: Exact candidate artifact ID
        required: false
        type: string
      candidate_artifact_digest:
        description: Canonical candidate digest sha256:<64 lowercase hex>
        required: false
        type: string
      readiness_run_id:
        description: Exact successful readiness workflow run ID
        required: false
        type: string
      readiness_run_attempt:
        description: Exact successful readiness workflow run attempt
        required: false
        type: string
      readiness_artifact_id:
        description: Exact readiness artifact ID
        required: false
        type: string
      readiness_artifact_digest:
        description: Canonical readiness digest sha256:<64 lowercase hex>
        required: false
        type: string

permissions: {}

concurrency:
  group: effect-build-npm-release
  cancel-in-progress: false

jobs:
  admit-dispatch:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Admit only one exact fail-closed protocol mode
        shell: bash
        env:
          API_ROOT: ${{ github.api_url }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          READINESS_ARTIFACT_DIGEST: ${{ inputs.readiness_artifact_digest }}
          READINESS_ARTIFACT_ID: ${{ inputs.readiness_artifact_id }}
          READINESS_RUN_ATTEMPT: ${{ inputs.readiness_run_attempt }}
          READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$REPOSITORY" != "mannyc2/effect-build" || ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release dispatch is bound to one full lowercase current-main SHA" >&2
            exit 1
          fi
          candidate=("$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" "$CANDIDATE_ARTIFACT_ID")
          readiness=("$READINESS_RUN_ID" "$READINESS_RUN_ATTEMPT" "$READINESS_ARTIFACT_ID")
          require_empty() {
            local value
            for value in "$@"; do [[ -z "$value" ]] || return 1; done
          }
          require_coordinate() {
            local run_id="$1" attempt="$2" artifact_id="$3" digest="$4"
            [[ "$run_id" =~ ^[1-9][0-9]*$ \
              && "$attempt" =~ ^[1-9][0-9]*$ \
              && "$artifact_id" =~ ^[1-9][0-9]*$ \
              && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          }
          case "$MODE" in
            prepare-exact-sha)
              require_empty "${candidate[@]}" "$CANDIDATE_ARTIFACT_DIGEST" \
                "${readiness[@]}" "$READINESS_ARTIFACT_DIGEST" || {
                echo "prepare-exact-sha rejects candidate and readiness coordinates" >&2
                exit 1
              }
              ;;
            certify-exact-sha)
              require_coordinate "${candidate[@]}" "$CANDIDATE_ARTIFACT_DIGEST" \
                && require_empty "${readiness[@]}" "$READINESS_ARTIFACT_DIGEST" || {
                echo "certify-exact-sha requires only one canonical candidate coordinate" >&2
                exit 1
              }
              ;;
            publish-certified-bytes)
              require_coordinate "${candidate[@]}" "$CANDIDATE_ARTIFACT_DIGEST" \
                && require_coordinate "${readiness[@]}" "$READINESS_ARTIFACT_DIGEST" || {
                echo "publish-certified-bytes requires canonical candidate and readiness coordinates" >&2
                exit 1
              }
              ;;
            *)
              echo "unknown release protocol mode" >&2
              exit 1
              ;;
          esac
          env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" API_ROOT="$API_ROOT" \
            GH_TOKEN="$GH_TOKEN" REPOSITORY="$REPOSITORY" SOURCE_SHA="$SOURCE_SHA" \
            node --input-type=module <<'NODE'
          import { request as httpsRequest } from "node:https";
          import { rootCertificates } from "node:tls";

          const { API_ROOT: apiRoot, GH_TOKEN: token, REPOSITORY: repository, SOURCE_SHA: sourceSha } = process.env;
          delete process.env.GH_TOKEN;
          if (
            apiRoot !== "https://api.github.com"
            || repository !== "mannyc2/effect-build"
            || !/^[0-9a-f]{40}$/u.test(sourceSha ?? "")
            || typeof token !== "string"
            || token.length === 0
            || /[\r\n]/u.test(token)
          ) throw new Error("dispatch current-main boundary is not canonical");
          const requestInactivityTimeoutMilliseconds = 60_000;
          const metadataTotalTimeoutMilliseconds = 60_000;
          const maximumBytes = 8 * 1024 * 1024;
          const parsed = new URL(`/repos/${repository}/git/ref/heads/main`, apiRoot);
          const bytes = await new Promise((resolveRead, rejectRead) => {
            let settled = false;
            const operation = httpsRequest({
              agent: false,
              ca: rootCertificates,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "User-Agent": "effect-build-release-dispatch-boundary/1",
                "X-GitHub-Api-Version": "2022-11-28",
              },
              hostname: parsed.hostname,
              joinDuplicateHeaders: false,
              method: "GET",
              minVersion: "TLSv1.2",
              path: parsed.pathname,
              port: 443,
              protocol: "https:",
              rejectUnauthorized: true,
              servername: parsed.hostname,
              timeout: requestInactivityTimeoutMilliseconds,
            }, (response) => {
              const contentLengthValues = response.headersDistinct?.["content-length"];
              const contentTypeValues = response.headersDistinct?.["content-type"];
              const contentEncodingValues = response.headersDistinct?.["content-encoding"];
              const locationValues = response.headersDistinct?.location;
              const contentLength = response.headers["content-length"];
              const contentType = response.headers["content-type"];
              const contentEncoding = response.headers["content-encoding"];
              const location = response.headers.location;
              const declared = contentLength === undefined ? undefined : Number(contentLength);
              if (
                response.statusCode !== 200
                || (Array.isArray(contentLengthValues) && contentLengthValues.length > 1)
                || (Array.isArray(contentTypeValues) && contentTypeValues.length > 1)
                || (Array.isArray(contentEncodingValues) && contentEncodingValues.length > 1)
                || (Array.isArray(locationValues) && locationValues.length > 1)
                || location !== undefined
                || response.headers["content-range"] !== undefined
                || (contentEncoding !== undefined && contentEncoding !== "identity")
                || typeof contentType !== "string"
                || !/^application\/(?:json|[^;]+\+json)(?:\s*;|$)/iu.test(contentType)
                || (declared !== undefined
                  && (!Number.isSafeInteger(declared) || declared <= 0 || declared > maximumBytes))
              ) {
                response.resume();
                finish(new Error("dispatch current-main response is not exact terminal JSON"));
                return;
              }
              const chunks = [];
              let total = 0;
              response.on("data", (chunk) => {
                const part = Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk);
                total += part.byteLength;
                if (total > maximumBytes) {
                  response.destroy();
                  finish(new Error("dispatch current-main response exceeded its byte bound"));
                } else chunks.push(part);
              });
              response.on("aborted", () => finish(new Error("dispatch current-main response aborted")));
              response.on("error", () => finish(new Error("dispatch current-main response failed")));
              response.on("end", () => {
                if (total === 0 || (declared !== undefined && declared !== total)) {
                  finish(new Error("dispatch current-main response is empty or truncated"));
                } else finish(undefined, Buffer.concat(chunks, total));
              });
            });
            const timer = setTimeout(() => finish(new Error("dispatch current-main request exceeded its total time bound")),
              metadataTotalTimeoutMilliseconds);
            timer.unref();
            const finish = (error, value) => {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              if (error === undefined) resolveRead(value);
              else {
                operation.destroy();
                rejectRead(error);
              }
            };
            operation.on("timeout", () => finish(new Error("dispatch current-main request timed out")));
            operation.on("error", () => finish(new Error("dispatch current-main request failed")));
            operation.end();
          });
          const main = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
          if (
            main.ref !== "refs/heads/main"
            || main.object?.type !== "commit"
            || main.object?.sha !== sourceSha
          ) throw new Error("source_sha is not authenticated current main");
          NODE

  prepare-candidate:
    if: inputs.mode == 'prepare-exact-sha'
    needs: admit-dispatch
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      workflow: ${{ steps.candidate-coordinate.outputs.workflow }}
      source-sha: ${{ steps.candidate-coordinate.outputs.source-sha }}
      run-id: ${{ steps.candidate-coordinate.outputs.run-id }}
      run-attempt: ${{ steps.candidate-coordinate.outputs.run-attempt }}
      artifact-digest: ${{ steps.candidate-coordinate.outputs.artifact-digest }}
      artifact-id: ${{ steps.candidate-coordinate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Admit the exact immutable source revision
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be one full lowercase Git SHA" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "checkout mismatch: expected $EXPECTED_SHA, observed $actual_sha" >&2
            exit 1
          fi
          env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" \
            ACTIONS_READ_TOKEN="$ACTIONS_READ_TOKEN" REPOSITORY="$REPOSITORY" SOURCE_SHA="$SOURCE_SHA" \
            node scripts/release/assert-current-main.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: node scripts/release/install-frozen-release-dependencies.mjs
      - run: bun run verify
      - name: Pack the immutable release-consumer handoff
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/npm-release-candidate
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: node scripts/release/prepare-npm-candidate.mjs "$CANDIDATE_DIR" "$EXPECTED_SHA"
      - name: Bind the generated candidate artifact identity
        id: candidate-policy
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const contract = JSON.parse(readFileSync("tooling/effect-build-contract.json", "utf8"));
          const release = contract.releaseCertification;
          const authority = release?.githubAuthority;
          const candidate = release?.candidate;
          const expectedWorkflow = `${authority?.repository}/${candidate?.workflowPath}@refs/heads/${authority?.branchPolicy?.name}`;
          if (
            contract.schema !== "effect-build/combined-contract@1"
            || !/^[0-9a-f]{40}$/u.test(process.env.EXPECTED_SHA ?? "")
            || !/^[1-9][0-9]*$/u.test(authority?.repositoryId ?? "")
            || candidate?.workflow !== expectedWorkflow
            || candidate?.event !== "workflow_dispatch"
            || candidate?.artifactName !== "npm-release-candidate-<sourceSha>"
            || !Number.isSafeInteger(candidate?.retentionDays)
            || candidate.retentionDays <= 0
          ) throw new Error("generated candidate artifact identity is invalid");
          writeFileSync(process.env.GITHUB_OUTPUT, [
            `artifact-name=${candidate.artifactName.replace("<sourceSha>", process.env.EXPECTED_SHA)}`,
            `event=${candidate.event}`,
            `head-branch=${authority.branchPolicy.name}`,
            `repository=${authority.repository}`,
            `repository-id=${authority.repositoryId}`,
            `retention-days=${candidate.retentionDays}`,
            `workflow=${candidate.workflow}`,
            `workflow-path=${candidate.workflowPath}`,
            "",
          ].join("\n"), { flag: "a" });
          NODE
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.candidate-policy.outputs.artifact-name }}
          path: ${{ runner.temp }}/npm-release-candidate
          if-no-files-found: error
          retention-days: ${{ steps.candidate-policy.outputs.retention-days }}
          compression-level: 0
      - name: Canonicalize and verify the upload-action artifact digest boundary
        id: candidate-coordinate
        shell: bash
        env:
          API_ROOT: ${{ github.api_url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.candidate-policy.outputs.artifact-name }}
          EXPECTED_EVENT: ${{ steps.candidate-policy.outputs.event }}
          EXPECTED_HEAD_BRANCH: ${{ steps.candidate-policy.outputs.head-branch }}
          EXPECTED_REPOSITORY: ${{ steps.candidate-policy.outputs.repository }}
          EXPECTED_REPOSITORY_ID: ${{ steps.candidate-policy.outputs.repository-id }}
          EXPECTED_WORKFLOW: ${{ steps.candidate-policy.outputs.workflow }}
          EXPECTED_WORKFLOW_PATH: ${{ steps.candidate-policy.outputs.workflow-path }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          UPLOAD_ACTION_BARE_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$API_ROOT" != "https://api.github.com" \
            || "$REPOSITORY" != "$EXPECTED_REPOSITORY" \
            || ! "$EXPECTED_REPOSITORY_ID" =~ ^[1-9][0-9]*$ \
            || ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ \
            || ! "$RUN_ID" =~ ^[1-9][0-9]*$ \
            || ! "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
            || ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ \
            || ! "$UPLOAD_ACTION_BARE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "upload-artifact returned a non-canonical boundary coordinate" >&2
            exit 1
          fi
          canonical_digest="sha256:$UPLOAD_ACTION_BARE_DIGEST"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          [[ "$GH_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "GitHub authorization token is not safe for the private config boundary" >&2
            exit 1
          }
          env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" \
            ACTIONS_READ_TOKEN="$GH_TOKEN" ARTIFACT_ID="$ARTIFACT_ID" \
            EXPECTED_ARTIFACT_NAME="$EXPECTED_ARTIFACT_NAME" EXPECTED_EVENT="$EXPECTED_EVENT" \
            EXPECTED_HEAD_BRANCH="$EXPECTED_HEAD_BRANCH" EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" EXPECTED_WORKFLOW="$EXPECTED_WORKFLOW" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" REPOSITORY="$REPOSITORY" \
            RUN_ATTEMPT="$RUN_ATTEMPT" RUN_ID="$RUN_ID" SOURCE_SHA="$SOURCE_SHA" \
            UPLOAD_ACTION_BARE_DIGEST="$UPLOAD_ACTION_BARE_DIGEST" \
            node scripts/release/post-upload-artifact-observation.mjs "$stage"
          node --input-type=module - "$stage/artifact.json" "$stage/artifact.zip" \
            "$stage/run.json" "$ARTIFACT_ID" "$canonical_digest" "$SOURCE_SHA" \
            "$RUN_ID" "$RUN_ATTEMPT" "$EXPECTED_ARTIFACT_NAME" "$EXPECTED_EVENT" \
            "$EXPECTED_HEAD_BRANCH" "$EXPECTED_REPOSITORY" "$EXPECTED_REPOSITORY_ID" \
            "$EXPECTED_WORKFLOW" "$EXPECTED_WORKFLOW_PATH" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const [
            metadataPath,
            zipPath,
            runPath,
            artifactId,
            digest,
            sourceSha,
            runId,
            runAttempt,
            artifactName,
            expectedEvent,
            expectedBranch,
            repository,
            repositoryId,
            expectedWorkflow,
            expectedWorkflowPath,
          ] = process.argv.slice(2);
          const metadata = JSON.parse(readFileSync(metadataPath, "utf8"));
          const run = JSON.parse(readFileSync(runPath, "utf8"));
          const zipDigest = createHash("sha256").update(readFileSync(zipPath)).digest("hex");
          if (
            expectedWorkflow !== `${repository}/${expectedWorkflowPath}@refs/heads/${expectedBranch}`
            || metadata.id !== Number(artifactId)
            || metadata.name !== artifactName
            || metadata.digest !== digest
            || metadata.expired !== false
            || metadata.workflow_run?.id !== Number(runId)
            || metadata.workflow_run?.head_branch !== expectedBranch
            || metadata.workflow_run?.head_sha !== sourceSha
            || metadata.workflow_run?.repository_id !== Number(repositoryId)
            || metadata.workflow_run?.head_repository_id !== Number(repositoryId)
            || run.id !== Number(runId)
            || run.run_attempt !== Number(runAttempt)
            || run.path !== expectedWorkflowPath
            || run.head_sha !== sourceSha
            || run.head_branch !== expectedBranch
            || run.event !== expectedEvent
            || run.status !== "in_progress"
            || run.conclusion !== null
            || run.repository?.id !== Number(repositoryId)
            || run.repository?.full_name !== repository
            || run.head_repository?.id !== Number(repositoryId)
            || run.head_repository?.full_name !== repository
            || zipDigest !== digest.slice("sha256:".length)
          ) throw new Error("upload artifact REST metadata or downloaded ZIP bytes changed");
          NODE
          {
            echo "workflow=$EXPECTED_WORKFLOW"
            echo "source-sha=$SOURCE_SHA"
            echo "run-id=$RUN_ID"
            echo "run-attempt=$RUN_ATTEMPT"
            echo "artifact-id=$ARTIFACT_ID"
            echo "artifact-digest=$canonical_digest"
          } >> "$GITHUB_OUTPUT"

  protected-npm:
    if: inputs.mode == 'certify-exact-sha' || inputs.mode == 'publish-certified-bytes'
    needs: admit-dispatch
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      certification-workflow: ${{ steps.certification-coordinate.outputs.workflow }}
      certification-source-sha: ${{ steps.certification-coordinate.outputs.source-sha }}
      certification-run-id: ${{ steps.certification-coordinate.outputs.run-id }}
      certification-run-attempt: ${{ steps.certification-coordinate.outputs.run-attempt }}
      certification-artifact-digest: ${{ steps.certification-coordinate.outputs.artifact-digest }}
      certification-artifact-id: ${{ steps.certification-coordinate.outputs.artifact-id }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Re-observe protected authority after environment approval
        shell: bash
        env:
          API_ROOT: ${{ github.api_url }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$API_ROOT" == "https://api.github.com" ]] || {
            echo "protected GitHub authorization requires exactly https://api.github.com" >&2
            exit 1
          }
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          [[ "$GH_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "GitHub authorization token is not safe for the private config boundary" >&2
            exit 1
          }
          if [[ -n "${EFFECT_BUILD_FAKE_EXECUTION_ROOT+x}" ]]; then
            fake_boundary_environment=(
              "PATH=$PATH"
              "LANG=${LANG:-C.UTF-8}"
              "EFFECT_BUILD_FAKE_BOUNDARY=${EFFECT_BUILD_FAKE_BOUNDARY:?}"
              "EFFECT_BUILD_FAKE_NODE=${EFFECT_BUILD_FAKE_NODE:?}"
              "FAKE_RELEASE_STATE=${FAKE_RELEASE_STATE:?}"
            )
            github_get() {
              local endpoint="$1"
              local output="$2"
              local accept="${3:-application/vnd.github+json}"
              printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" \
                | env -i "${fake_boundary_environment[@]}" curl \
                --disable --fail --silent --show-error \
                --connect-timeout 15 --max-time 120 --retry 0 \
                --proto '=https' --proto-redir '=https' \
                --config - \
                --header "Accept: $accept" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_ROOT/repos/$REPOSITORY${endpoint:+/$endpoint}" \
                --output "$output"
            }
            github_get "" "$stage/repository.json"
            github_get "contents/tooling/effect-build-contract.json?ref=$EXPECTED_SHA" "$stage/contract.json" \
              'application/vnd.github.raw+json'
            github_get "environments/npm" "$stage/environment.json"
            github_get "environments/npm/deployment-branch-policies" "$stage/branch-policies.json"
            github_get "git/ref/heads/main" "$stage/main.json"
            github_get "actions/oidc/customization/sub" "$stage/oidc.json"
          else
            env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" API_ROOT="$API_ROOT" \
              EXPECTED_SHA="$EXPECTED_SHA" GH_TOKEN="$GH_TOKEN" REPOSITORY="$REPOSITORY" STAGE="$stage" \
              node --input-type=module <<'NODE'
            import { readFileSync, writeFileSync } from "node:fs";
            import { request as httpsRequest } from "node:https";
            import { resolve } from "node:path";
            import { rootCertificates } from "node:tls";
            import { isDeepStrictEqual } from "node:util";

            const apiRoot = process.env.API_ROOT;
            const expectedSha = process.env.EXPECTED_SHA;
            const repository = process.env.REPOSITORY;
            const stage = process.env.STAGE;
            const token = process.env.GH_TOKEN;
            if (
              apiRoot !== "https://api.github.com"
              || !/^[0-9a-f]{40}$/u.test(expectedSha ?? "")
              || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/u.test(repository ?? "")
              || repository?.includes("..")
              || typeof stage !== "string"
              || stage.length === 0
              || typeof token !== "string"
              || token.length === 0
              || /[\r\n]/u.test(token)
            ) throw new Error("protected GitHub HTTPS boundary inputs are not canonical");
            const requestInactivityTimeoutMilliseconds = 60_000;
            const metadataTotalTimeoutMilliseconds = 60_000;
            const maximumBytes = 8 * 1024 * 1024;
            const endpoints = Object.freeze([
              ["repository.json", `repos/${repository}`, "application/vnd.github+json"],
              [
                "contract.json",
                `repos/${repository}/contents/tooling/effect-build-contract.json?ref=${expectedSha}`,
                "application/vnd.github.raw+json",
              ],
              ["environment.json", `repos/${repository}/environments/npm`, "application/vnd.github+json"],
              [
                "branch-policies.json",
                `repos/${repository}/environments/npm/deployment-branch-policies`,
                "application/vnd.github+json",
              ],
              ["main.json", `repos/${repository}/git/ref/heads/main`, "application/vnd.github+json"],
              ["oidc.json", `repos/${repository}/actions/oidc/customization/sub`, "application/vnd.github+json"],
            ]);
            const responseHeader = (response, name) => {
              const values = response.headersDistinct?.[name];
              if (Array.isArray(values) && values.length > 1) throw new Error(`ambiguous ${name} header`);
