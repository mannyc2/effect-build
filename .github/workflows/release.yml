name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Preserve tested release tarballs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Restore the original candidate on resumption
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "release-packages")] | length')
          if [ "$count" = 1 ]; then
            gh run download "$GITHUB_RUN_ID" --name release-packages --dir "$RUNNER_TEMP/release-packages"
            node scripts/release-packages.mjs check "$RUNNER_TEMP/release-packages"
            echo "restored=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" != 0 ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo 'The original candidate is unavailable or ambiguous; refusing to repack a release retry.' >&2
            exit 1
          fi
      - if: steps.restore.outputs.restored != 'true'
        run: bun install --frozen-lockfile
      - if: steps.restore.outputs.restored != 'true'
        run: bun run verify
      - if: steps.restore.outputs.restored != 'true'
        run: node scripts/release-packages.mjs pack "$RUNNER_TEMP/release-packages"
      - if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages
          path: ${{ runner.temp }}/release-packages
          if-no-files-found: error
          retention-days: 90

  consumer:
    name: Installed release consumer (TS ${{ matrix.typescript }}, Node ${{ matrix.node }})
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typescript: '5.9.3', node-types: '24.3.0', node: '22.19.0' }
          - { typescript: '6.0.3', node-types: '24.13.3', node: '24.14.1' }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install and test every packed public export
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_TYPESCRIPT: ${{ matrix.typescript }}
          CONSUMER_NODE_TYPES: ${{ matrix.node-types }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name release-packages --dir "$RUNNER_TEMP/release-packages"
          node scripts/consumer-acceptance.mjs "$RUNNER_TEMP/release-packages"

  publish:
    name: Publish or resume exact packages
    needs: consumer
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Publish missing packages and verify existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name release-packages --dir "$RUNNER_TEMP/release-packages"
          node scripts/release-packages.mjs publish "$RUNNER_TEMP/release-packages"
