name: Release

# Publishing requires two explicit acts: dispatch with one full commit SHA and
# approval of the npm-production environment. Ordinary CI never mutates npm.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA whose exact tree will be published
        required: true
        type: string
      approval:
        description: Explicitly authorize npm publication for that exact SHA
        required: true
        type: choice
        options:
          - do-not-publish
          - publish-exact-sha

permissions:
  contents: read
  id-token: write

# One release observes and mutates the lockstep namespace at a time. A queued
# dispatch is never allowed to cancel an in-flight publication attempt.
concurrency:
  group: effect-build-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.approval == 'publish-exact-sha'
    environment: npm-production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Admit the exact immutable source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be one full lowercase Git SHA" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "checkout mismatch: expected $EXPECTED_SHA, observed $actual_sha" >&2
            exit 1
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Pack, compare, and publish the lockstep surface
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mapfile -t names < <(node -e '
            const fs = require("node:fs");
            const surface = JSON.parse(fs.readFileSync("tooling/public-api.json", "utf8"));
            process.stdout.write(Object.keys(surface.packages).sort().join("\n") + "\n");
          ')
          if [[ "${#names[@]}" -ne 12 || "${names[0]}" != "effect-build" ]]; then
            echo "refusing non-canonical package surface" >&2
            exit 1
          fi

          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/effect-build/package.json", "utf8")).version')"
          declare -A tarballs
          declare -A integrities
          for name in "${names[@]}"; do
            package_name="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/${name}/package.json', 'utf8')).name")"
            if [[ "$package_name" != "$name" ]]; then
              echo "package directory/public identity mismatch: $name declares $package_name" >&2
              exit 1
            fi
            package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/${name}/package.json', 'utf8')).version")"
            if [[ "$package_version" != "$version" ]]; then
              echo "$name is $package_version; expected lockstep $version" >&2
              exit 1
            fi
            output="$(bun pm pack --destination "$stage" --cwd "packages/$name")"
            tarball_name="$(printf '%s\n' "$output" | awk '/\.tgz$/ { print $NF }' | tail -n 1)"
            if [[ -z "$tarball_name" || ! -f "$stage/${tarball_name##*/}" ]]; then
              echo "packing $name produced no tarball" >&2
              exit 1
            fi
            tarballs[$name]="$stage/${tarball_name##*/}"
            integrities[$name]="sha512-$(openssl dgst -sha512 -binary "${tarballs[$name]}" | openssl base64 -A)"
          done

          # Read-only preflight the entire lockstep namespace before the first
          # mutation. A conflict or an inconclusive read anywhere aborts with
          # every still-missing package untouched.
          missing=()
          for name in "${names[@]}"; do
            view_error="$stage/npm-view-error"
            : > "$view_error"
            set +e
            remote_output="$(npm view "$name@$version" dist.integrity --json 2>"$view_error")"
            view_status=$?
            set -e
            if [[ $view_status -eq 0 ]]; then
              remote_integrity="$(node -e '
                const value = JSON.parse(process.argv[1]);
                if (typeof value !== "string" || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(value)) {
                  process.stderr.write("registry returned no canonical sha512 integrity\n");
                  process.exit(1);
                }
                process.stdout.write(value);
              ' "$remote_output")"
              if [[ "$remote_integrity" != "${integrities[$name]}" ]]; then
                echo "$name@$version already exists with different bytes" >&2
                exit 1
              fi
              echo "$name@$version already has the exact packed integrity"
              continue
            fi
            if ! grep -Eiq 'E404|404 Not Found' "$view_error"; then
              echo "registry observation for $name@$version was inconclusive; refusing to publish" >&2
              sed -n '1,40p' "$view_error" >&2
              exit 1
            fi
            missing+=("$name")
            echo "$name@$version is explicitly absent"
          done

          echo "lockstep preflight admitted ${#missing[@]} missing package(s)"
          for name in "${missing[@]}"; do
            npm publish "${tarballs[$name]}" --provenance --access public
          done
