name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Pack and publish public packages
        run: |
          for package in packages/*; do
            if [ "$(node -p "require('./$package/package.json').private === true")" = true ]; then
              continue
            fi
            test "$GITHUB_REF_NAME" = "v$(node -p "require('./$package/package.json').version")"
            (cd "$package" && bun pm pack --filename "$RUNNER_TEMP/package.tgz" --quiet)
            npm publish "$RUNNER_TEMP/package.tgz" --access public --provenance
          done
